[pytest]
# Adds the repo root to sys.path so `from services.shared.contracts import ...`
# resolves from any test file. Before the v1.0.7a namespace-package conversion
# (which removed all tests/__init__.py files), pytest's rootdir discovery
# picked up the repo root via the `tests` package; that path is gone now, so
# we declare it explicitly.
#
# Without this, tests/integration/test_s2_baseline.py fails CI collection with
# ModuleNotFoundError: No module named 'services'.
pythonpath = .
