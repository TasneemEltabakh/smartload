# SmartLoad NGINX config — ALL-IN-ONE single-container variant.
#
# Differs from services/load-balancer/nginx/nginx.conf only in the upstream
# resolution strategy: the multi-container build re-resolves backend hostnames
# at request time via Docker's embedded DNS (127.0.0.11) because the pool is
# dynamic. In the single container there is no Docker DNS and the pool is a
# fixed set of in-container backend processes on 127.0.0.1:9001..9005, so we
# use a plain static upstream and a direct (non-variable) proxy_pass — no
# resolver needed, and a config reload never [emerg]-fails on an absent host.

# Workers run as root so they can write the shared /nginx-logs/access.log sink
# that the lb-otel-shipper tails (single-container; no separate volume owner).
user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {

    log_format smartload_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"service":"nginx",'
    '"client_ip":"$remote_addr",'
    '"request":"$request",'
    '"request_path":"$uri",'
    '"status":$status,'
    '"backend":"$upstream_addr",'
    '"latency":$request_time,'
    '"upstream_latency":"$upstream_response_time"'
    '}';

    access_log /dev/stdout            smartload_json;
    # Second sink tailed by the lb-otel-shipper, which emits one OTLP/HTTP-JSON
    # data point per request (per-request fidelity for the STDDEV/MAX queries).
    access_log /nginx-logs/access.log smartload_json;

    # Static backend pool — the five in-container test-backend node processes.
    # Equal weights; the lb-sidecar's dynamic weighting is inert in the single
    # container (it needs `docker exec nginx -s reload`, unavailable here), so
    # routing is round-robin. See docker/allinone/README.md.
    upstream backend_pool {
        server 127.0.0.1:9001 weight=1 max_fails=0;
        server 127.0.0.1:9002 weight=1 max_fails=0;
        server 127.0.0.1:9003 weight=1 max_fails=0;
        server 127.0.0.1:9004 weight=1 max_fails=0;
        server 127.0.0.1:9005 weight=1 max_fails=0;
    }

    server {
        listen 80;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"load-balancer"}';
        }

        location / {
            proxy_pass http://backend_pool;

            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
