[program:resource-collector]
; The resource-collector polls the Docker Engine stats API for sibling
; containers — neither the daemon nor siblings exist in the single container.
; Run it only if a docker socket is bind-mounted; otherwise idle (no crash-loop).
command=/bin/sh -c 'if [ -S /var/run/docker.sock ]; then exec /opt/venv/bin/python -u app.py; else echo "[resource-collector] no /var/run/docker.sock mounted; idling (single-container mode)"; exec sleep infinity; fi'
directory=/opt/smartload/services/resource-collector
priority=35
autorestart=true
startretries=20
environment=OTEL_COLLECTOR_URL="http://otel-collector:4318/v1/metrics",SERVICE_NAME="resource-collector",COMPOSE_PROJECT="smartload",POLL_INTERVAL_S="30"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

