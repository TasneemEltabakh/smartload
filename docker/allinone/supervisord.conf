autorestart=true
startretries=10
environment=GF_SECURITY_ADMIN_USER="admin",GF_SECURITY_ADMIN_PASSWORD="%(ENV_GRAFANA_PASSWORD)s",TIMESCALEDB_PASSWORD="%(ENV_TIMESCALEDB_PASSWORD)s",GF_SECURITY_ALLOW_EMBEDDING="true",GF_AUTH_ANONYMOUS_ENABLED="true",GF_AUTH_ANONYMOUS_ORG_NAME="Main Org.",GF_AUTH_ANONYMOUS_ORG_ROLE="Viewer"
