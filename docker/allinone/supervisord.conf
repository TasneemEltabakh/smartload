; SmartLoad all-in-one process supervisor.
; Every docker-compose service runs here as a managed process. Hostnames like
; `timescaledb` / `redis` / `otel-collector` resolve to 127.0.0.1 via the
; /etc/hosts aliases written by the entrypoint, so the per-service env below
; mirrors docker-compose.yml almost verbatim.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
; Inherited by every program; per-program `environment=` overrides keys.
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/opt/smartload/services",TIMESCALEDB_URL="postgresql://postgres:changeme@timescaledb:5432/smartloaddb",REDIS_URL="redis://redis:6379",OTEL_ENDPOINT="http://otel-collector:4318"

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── helpers: common stdout wiring is repeated per-program (supervisor has no
;    shared defaults block). All logs stream to the container stdout. ─────────

; ════════════════════════════════ Data layer ════════════════════════════════

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis-smartload.conf
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

