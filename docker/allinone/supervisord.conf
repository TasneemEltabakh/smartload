[program:redis-exporter]
command=/usr/bin/redis_exporter --redis.addr=redis://redis:6379 --web.listen-address=0.0.0.0:9121
priority=15
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:otel-collector]
command=/usr/bin/otelcol-contrib --config /etc/otelcol-contrib/config.yaml
