name: SmartLoad CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Run lint
        run: ruff check services test-backends


  build-services:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        service:
          - anomaly-detector
          - autoscaler
          - forecasting
          - policy-manager
          - rl-engine
          - telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build -t smartload-${{ matrix.service }} ./services/${{ matrix.service }}

      - name: Run container
        run: docker run -d -p 8080:8080 --name test-${{ matrix.service }} smartload-${{ matrix.service }}

      - name: Wait for service
        run: sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8080/health && exit 0
            echo "Waiting for service..."
            sleep 2
          done
          echo "Service failed to start"
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs test-${{ matrix.service }}

      - name: Stop container
        if: always()
        run: docker rm -f test-${{ matrix.service }}


  build-test-backend:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test-backend image
        run: docker build -t smartload-test-backend ./test-backends

      - name: Run test-backend container
        run: docker run -d -p 8080:8080 --name test-backend smartload-test-backend

      - name: Wait for server
        run: sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8080/health && exit 0
            echo "Waiting for server..."
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs test-backend

      - name: Stop container
        if: always()
        run: docker rm -f test-backend


  compose-test:
    runs-on: ubuntu-latest
    needs:
      - build-services
      - build-test-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start docker-compose environment
        run: docker compose up -d --build --scale test-backend=2

      - name: Wait for system startup
        run: sleep 10

      - name: Test load-balancer endpoint
        run: curl -f http://localhost:8080

      - name: Show running containers
        run: docker ps

      - name: Stop compose
        if: always()
        run: docker compose down
