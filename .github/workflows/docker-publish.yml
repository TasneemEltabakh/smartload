name: SmartLoad CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Run lint
        run: ruff check services test-backends

  structure-lint:
    # Anti-drift structural lints (stdlib-only, no extra deps). The Redis
    # channel registry is ENFORCED (--strict). The service/feature structure
    # and OpenAPI-route lints run PERMISSIVE (informational) — flipping them to
    # --strict is #139, gated on resolving their current warnings (rl-engine
    # classical-policy READMEs/tests, the adaptive-bench example scenario, and
    # documenting the /api/v1/metrics/* endpoints in the OpenAPI spec).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Redis channel registry (enforced)
        run: python scripts/lint-redis-channels.py --strict

      - name: Service / feature structure (permissive)
        run: python scripts/lint-structure.py

      - name: OpenAPI route coverage (permissive)
        run: python scripts/lint-openapi.py


  unit-tests:
    # Pure-Python tests (envelope round-trip, drop-reason callback, SQL
    # parameterisation, PolicyUpdate field contract). DB-backed tests in
    # the same file skip cleanly when no stack is up, so we run the whole
    # test_s2_baseline.py here for fast feedback and let the integration
    # job re-run it against a live TimescaleDB.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Install SDK in editable mode (for tests/unit/test_smartload_client.py)
        run: pip install -e clients/python

      - name: Install rl-engine runtime deps for per-service unit tests
        # tests/unit/rl-engine/* import numpy / gymnasium / sb3-contrib at
        # collection time. These ship inside the rl-engine container image
        # but the unit-tests job runs bare on the runner, so install the
        # service's requirements.txt explicitly. (sb3 pulls torch — slow but
        # cached by setup-python's pip wheel cache across runs.)
        run: pip install -r services/rl-engine/requirements.txt

      - name: Install bench-harness deps for experiments unit tests
        # tests/unit/experiments/test_bench_stats.py imports scipy / pandas via
        # experiments/_bench_common/bench_stats.py (#160). These ship in
        # experiments/adaptive-bench/requirements-bench.txt (the host-side bench
        # env), not the per-service images, so install them explicitly here.
        run: pip install scipy pandas

      - name: Install joblib for the anomaly-detector engine unit tests
        # tests/unit/anomaly-detector/test_isolation_forest_engine.py imports
        # the IF engine, whose module does `import joblib` at load. The test
        # stubs the model (no sklearn needed) but guards its import with
        # pytest.importorskip("joblib") — install joblib so it runs here
        # instead of skipping.
        run: pip install joblib

      - name: Run pure-Python tests
        run: pytest tests/integration/test_s2_baseline.py tests/integration/test_telemetry_parser.py tests/integration/test_lb_otel_shipper.py -v

      - name: Run per-service unit tests
        # Pure-Python tests under tests/unit/ — no Docker, no Redis, no DB.
        # Each service test directory runs in its OWN pytest invocation so the
        # services' top-level modules (engine_base, runloop, engines, policies)
        # don't collide in sys.modules across siblings. Loose test files at the
        # tests/unit/ root run once at the end. Empty test dirs (placeholders
        # for services that don't have a unit suite yet) are skipped — only
        # dirs containing test_*.py files are invoked.
        run: |
          set -e
          for dir in tests/unit/*/; do
            [ -d "$dir" ] || continue
            ls "$dir"test_*.py >/dev/null 2>&1 || continue
            pytest "$dir" -v
          done
          for f in tests/unit/test_*.py; do
            [ -f "$f" ] || continue
            pytest "$f" -v
          done


  build-services:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        service:
          - anomaly-detector
          - autoscaler
          - forecasting
          - lb-otel-shipper
          - lb-sidecar
          - policy-manager
          - rl-engine
          - telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build service image (default context)
        if: matrix.service != 'telemetry' && matrix.service != 'autoscaler' && matrix.service != 'policy-manager' && matrix.service != 'anomaly-detector' && matrix.service != 'forecasting' && matrix.service != 'rl-engine' && matrix.service != 'lb-sidecar'
        run: docker build -t smartload-${{ matrix.service }} ./services/${{ matrix.service }}

      - name: Build image with wider context (services that import shared/)
        # Telemetry, autoscaler, policy-manager, anomaly-detector,
        # forecasting, rl-engine, and lb-sidecar import services/shared/*,
        # so their build context is ./services and the Dockerfile pulls in
        # shared/ alongside app.py + any service-local modules.
        if: matrix.service == 'telemetry' || matrix.service == 'autoscaler' || matrix.service == 'policy-manager' || matrix.service == 'anomaly-detector' || matrix.service == 'forecasting' || matrix.service == 'rl-engine' || matrix.service == 'lb-sidecar'
        run: docker build -t smartload-${{ matrix.service }} -f services/${{ matrix.service }}/Dockerfile ./services

      - name: Run container
        # The shipper has no HTTP port (it's a tail-and-emit sidecar) — start
        # it without a port mapping and verify it doesn't immediately exit.
        if: matrix.service != 'lb-otel-shipper'
        run: docker run -d -p 8080:8080 -e PORT=8080 --name test-${{ matrix.service }} smartload-${{ matrix.service }}

      - name: Run shipper container (no HTTP, no nginx log to tail yet)
        if: matrix.service == 'lb-otel-shipper'
        run: docker run -d --name test-${{ matrix.service }} smartload-${{ matrix.service }}

      - name: Wait for service
        run: sleep 5

      - name: Health check
        # Standalone service has no Redis / TimescaleDB, so /health correctly
        # reports degraded (503 per SOT §11). This step verifies the HTTP
        # server is up by accepting either 200 (full health) or 503 (degraded
        # but reachable). The compose-test job below validates full health
        # against the live stack.
        if: matrix.service != 'lb-otel-shipper'
        run: |
          for i in {1..10}; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" http://localhost:8080/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Service reachable (HTTP $code)"
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for service... (last status: $code)"
            sleep 2
          done
          echo "Service failed to start"
          exit 1

      - name: Liveness check (shipper)
        # Shipper has no HTTP — assert the process is still running after
        # warm-up. Compose-test validates the actual log → OTLP path.
        if: matrix.service == 'lb-otel-shipper'
        run: |
          running=$(docker inspect -f '{{.State.Running}}' test-${{ matrix.service }})
          if [ "$running" != "true" ]; then
            echo "Shipper exited"
            docker logs test-${{ matrix.service }}
            exit 1
          fi
          echo "Shipper is running"

      - name: Show container logs
        if: failure()
        run: docker logs test-${{ matrix.service }}

      - name: Stop container
        if: always()
        run: docker rm -f test-${{ matrix.service }}


  build-test-backend:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test-backend image
        run: docker build -t smartload-test-backend ./test-backends

      - name: Run test-backend container
        run: docker run -d -p 8080:8080 --name test-backend smartload-test-backend

      - name: Wait for server
        run: sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8080/health && exit 0
            echo "Waiting for server..."
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs test-backend

      - name: Stop container
        if: always()
        run: docker rm -f test-backend


  runtime-import-smoke:
    # Builds the rl-engine runtime image and asserts that serving imports do NOT
    # pull in any training.* module (Amendment A — training/serving separation).
    # Runs after the image is confirmed to build but before the full compose test.
    runs-on: ubuntu-latest
    needs: build-services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build rl-engine runtime image
        run: docker build -t smartload-rl-engine-smoke -f services/rl-engine/Dockerfile ./services

      - name: Assert serving imports don't pull in training code
        run: |
          docker run --rm smartload-rl-engine-smoke python -c "
          import sys
          import app
          # PPOPolicy is the main serving consumer of obs_builder + SB3
          try:
              import policies.ppo.policy
          except Exception:
              pass  # policy.zip absent in CI; import path is what matters
          training_mods = [m for m in sys.modules if m.startswith('training')]
          if training_mods:
              print('FAIL: training modules leaked into runtime image:', training_mods)
              sys.exit(1)
          print('PASS: no training.* modules in sys.modules')
          "


  compose-test:
    # Brings up the full SmartLoad stack and runs the integration test
    # suites against it: the 33 Phase-0 wiring tests + the S2 baseline
    # tests (envelope, parameterised SQL, retention policies, CAGG).
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - build-services
      - build-test-backend
      - runtime-import-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Start docker-compose environment
        # --scale test-backend=5 matches the 5 enumerated `server`
        # entries in services/load-balancer/nginx/nginx.conf and
        # config/policy.yaml's max_backends. NGINX bails at config-load
        # if any upstream hostname doesn't resolve, so CI must spin up
        # the full 5. (Local dev gets the same count via
        # docker-compose.yml's `deploy.replicas: 5`; --scale overrides
        # that, so CI has to spell it out.)
        run: docker compose up -d --build --scale test-backend=5

      - name: Wait for stack to become healthy
        # Poll TimescaleDB and Redis directly; the AI-service /health
        # endpoints already poll their deps and we want to wait until
        # all are reachable from the runner.
        run: |
          for i in {1..30}; do
            tsdb_ok=$(docker compose exec -T timescaledb pg_isready -U postgres -d smartloaddb >/dev/null 2>&1 && echo yes || echo no)
            redis_ok=$(docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG && echo yes || echo no)
            if [ "$tsdb_ok" = "yes" ] && [ "$redis_ok" = "yes" ]; then
              echo "Stack ready (tsdb=$tsdb_ok, redis=$redis_ok)"
              break
            fi
            echo "Waiting (try $i/30): tsdb=$tsdb_ok redis=$redis_ok"
            sleep 2
          done
          # Brief grace period for AI-service health probes to converge.
          sleep 5

      - name: Show running containers
        run: docker ps

      - name: Test load-balancer endpoint
        run: curl -f http://localhost:8080

      - name: Run Phase-0 wiring tests (33 tests)
        run: pytest tests/integration/test_pipeline_health.py -v

      - name: Run S2 baseline tests against live stack (39 tests)
        # Same file as unit-tests, but the DB-backed schema tests now
        # actually execute instead of being skipped.
        run: pytest tests/integration/test_s2_baseline.py -v

      - name: Run telemetry ingest tests against live stack
        # T1.1 acceptance: OTLP/HTTP-JSON ingress, DB persistence, and
        # the GET /api/v1/metrics read API.
        run: pytest tests/integration/test_telemetry_ingest.py -v

      - name: Run lb-otel-shipper tests against live stack
        # T1.2 acceptance: traffic driven through NGINX results in
        # per-request rows in `metrics` with STDDEV > 0 (per-request
        # fidelity — the Approach B proof point).
        run: pytest tests/integration/test_lb_otel_shipper.py -v

      - name: Run T2.3 closed-loop tests against live stack (#103)
        # Two of three scenarios run by default: anomaly-reroute and
        # safe-mode. The forecast-driven scale-out scenario is marked
        # @pytest.mark.slow (~3 min wall-time, needs provisioning
        # enabled) and is deselected here. Operators run it locally
        # against an adaptive-bench-configured stack with `-m slow`.
        run: pytest tests/integration/test_t23_control_loop.py -v -m "not slow"

      - name: Dump service logs on failure
        if: failure()
        run: |
          for s in load-balancer lb-otel-shipper lb-sidecar test-backend telemetry anomaly-detector forecasting rl-engine autoscaler policy-manager otel-collector redis timescaledb; do
            echo "===== $s ====="
            docker compose logs --tail=80 "$s" || true
          done

      - name: Stop compose
        if: always()
        run: docker compose down -v
