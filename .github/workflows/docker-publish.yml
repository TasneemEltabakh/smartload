name: SmartLoad CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Run lint
        run: ruff check services test-backends


  unit-tests:
    # Pure-Python tests (envelope round-trip, drop-reason callback, SQL
    # parameterisation, PolicyUpdate field contract). DB-backed tests in
    # the same file skip cleanly when no stack is up, so we run the whole
    # test_s2_baseline.py here for fast feedback and let the integration
    # job re-run it against a live TimescaleDB.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Run pure-Python tests
        run: pytest tests/integration/test_s2_baseline.py tests/integration/test_telemetry_parser.py -v


  build-services:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        service:
          - anomaly-detector
          - autoscaler
          - forecasting
          - policy-manager
          - rl-engine
          - telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build service image (default context)
        if: matrix.service != 'telemetry'
        run: docker build -t smartload-${{ matrix.service }} ./services/${{ matrix.service }}

      - name: Build telemetry image (wider context for shared/)
        # Telemetry imports services/shared/queries.py, so its build context
        # is ./services and the Dockerfile pulls in shared/ alongside app.py.
        if: matrix.service == 'telemetry'
        run: docker build -t smartload-telemetry -f services/telemetry/Dockerfile ./services

      - name: Run container
        run: docker run -d -p 8080:8080 -e PORT=8080 --name test-${{ matrix.service }} smartload-${{ matrix.service }}

      - name: Wait for service
        run: sleep 5

      - name: Health check
        # Standalone service has no Redis / TimescaleDB, so /health correctly
        # reports degraded (503 per SOT §11). This step verifies the HTTP
        # server is up by accepting either 200 (full health) or 503 (degraded
        # but reachable). The compose-test job below validates full health
        # against the live stack.
        run: |
          for i in {1..10}; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" http://localhost:8080/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Service reachable (HTTP $code)"
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for service... (last status: $code)"
            sleep 2
          done
          echo "Service failed to start"
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs test-${{ matrix.service }}

      - name: Stop container
        if: always()
        run: docker rm -f test-${{ matrix.service }}


  build-test-backend:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test-backend image
        run: docker build -t smartload-test-backend ./test-backends

      - name: Run test-backend container
        run: docker run -d -p 8080:8080 --name test-backend smartload-test-backend

      - name: Wait for server
        run: sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8080/health && exit 0
            echo "Waiting for server..."
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs test-backend

      - name: Stop container
        if: always()
        run: docker rm -f test-backend


  compose-test:
    # Brings up the full SmartLoad stack and runs the integration test
    # suites against it: the 33 Phase-0 wiring tests + the S2 baseline
    # tests (envelope, parameterised SQL, retention policies, CAGG).
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - build-services
      - build-test-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Start docker-compose environment
        run: docker compose up -d --build --scale test-backend=2

      - name: Wait for stack to become healthy
        # Poll TimescaleDB and Redis directly; the AI-service /health
        # endpoints already poll their deps and we want to wait until
        # all are reachable from the runner.
        run: |
          for i in {1..30}; do
            tsdb_ok=$(docker compose exec -T timescaledb pg_isready -U postgres -d smartloaddb >/dev/null 2>&1 && echo yes || echo no)
            redis_ok=$(docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG && echo yes || echo no)
            if [ "$tsdb_ok" = "yes" ] && [ "$redis_ok" = "yes" ]; then
              echo "Stack ready (tsdb=$tsdb_ok, redis=$redis_ok)"
              break
            fi
            echo "Waiting (try $i/30): tsdb=$tsdb_ok redis=$redis_ok"
            sleep 2
          done
          # Brief grace period for AI-service health probes to converge.
          sleep 5

      - name: Show running containers
        run: docker ps

      - name: Test load-balancer endpoint
        run: curl -f http://localhost:8080

      - name: Run Phase-0 wiring tests (33 tests)
        run: pytest tests/integration/test_pipeline_health.py -v

      - name: Run S2 baseline tests against live stack (39 tests)
        # Same file as unit-tests, but the DB-backed schema tests now
        # actually execute instead of being skipped.
        run: pytest tests/integration/test_s2_baseline.py -v

      - name: Run telemetry ingest tests against live stack
        # T1.1 acceptance: OTLP/HTTP-JSON ingress, DB persistence, and
        # the GET /api/v1/metrics read API.
        run: pytest tests/integration/test_telemetry_ingest.py -v

      - name: Dump service logs on failure
        if: failure()
        run: |
          for s in nginx test-backend telemetry anomaly-detector forecasting rl-engine autoscaler policy-manager redis timescaledb; do
            echo "===== $s ====="
            docker compose logs --tail=80 "$s" || true
          done

      - name: Stop compose
        if: always()
        run: docker compose down -v
