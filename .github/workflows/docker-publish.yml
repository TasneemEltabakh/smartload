name: SmartLoad CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-services:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - anomaly-detector
          - autoscaler
          - forecasting
          - load-balancer
          - policy-manager
          - rl-engine
          - servers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build service
        run: docker build -t smartload-${{ matrix.service }} ./services/${{ matrix.service }}

      - name: Run container
        run: docker run -d -p 8080:8080 --name test-${{ matrix.service }} smartload-${{ matrix.service }}

      - name: Wait for service
        run: sleep 5

      - name: Health check
        run: curl --fail http://localhost:8080/health

      - name: Stop container
        if: always()
        run: docker rm -f test-${{ matrix.service }}


  build-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build telemetry service
        run: docker build -t smartload-telemetry ./telemetry

      - name: Run telemetry container
        run: docker run -d -p 8080:8080 --name telemetry-test smartload-telemetry

      - name: Wait for service
        run: sleep 5

      - name: Health check
        run: curl --fail http://localhost:8080/health

      - name: Stop container
        if: always()
        run: docker rm -f telemetry-test
