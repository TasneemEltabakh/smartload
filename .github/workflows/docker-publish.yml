name: SmartLoad CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Run lint
        run: ruff check services telemetry


  build-services:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        service:
          - anomaly-detector
          - autoscaler
          - forecasting
          - load-balancer
          - policy-manager
          - rl-engine
          - servers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build -t smartload-${{ matrix.service }} ./services/${{ matrix.service }}

      - name: Run container
        run: docker run -d -p 8080:8080 --name test-${{ matrix.service }} smartload-${{ matrix.service }}

      - name: Wait for service
        run: sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8080/health && exit 0
            echo "Waiting for service..."
            sleep 2
          done
          echo "Service failed to start"
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs test-${{ matrix.service }}

      - name: Stop container
        if: always()
        run: docker rm -f test-${{ matrix.service }}


  build-telemetry:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build telemetry image
        run: docker build -t smartload-telemetry ./telemetry

      - name: Run telemetry container
        run: docker run -d -p 8080:8080 --name telemetry-test smartload-telemetry

      - name: Wait for service
        run: sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8080/health && exit 0
            echo "Waiting for telemetry..."
            sleep 2
          done
          echo "Telemetry service failed to start"
          exit 1

      - name: Show telemetry logs
        if: failure()
        run: docker logs telemetry-test

      - name: Stop container
        if: always()
        run: docker rm -f telemetry-test
