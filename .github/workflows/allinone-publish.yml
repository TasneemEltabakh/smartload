name: Publish all-in-one image

# Builds Dockerfile.allinone and pushes it to the GitHub Container Registry.
# Uses the built-in GITHUB_TOKEN (packages: write) — no extra secrets needed.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.allinone"
      - "docker/allinone/**"
      - ".github/workflows/allinone-publish.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/smartload-allinone:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/smartload-allinone:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
