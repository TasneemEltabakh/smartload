# SmartLoad — Prometheus scrape configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OTel Collector exposes all forwarded metrics on port 8889
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # #116 Redis exporter — control-bus health (connected_clients, ops/sec,
  # memory_used_bytes, keyspace_hits/misses, per-channel pub/sub depth via
  # redis_pubsub_channels / redis_pubsub_patterns). Default scrape interval
  # is fine; Redis stats update faster than 15s anyway.
  - job_name: redis_exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  # SmartLoad services — each exposes Prometheus /metrics via Flask (#161):
  # <prefix>_up / _cycle_total / _cycle_duration_seconds / _publish_total /
  # _publish_duration_seconds, plus per-service decision counters
  # (rl_engine_action_total, anomaly_detector_isolate_total,
  # autoscaler_scale_total, lb_sidecar_message_total). The default
  # metrics_path (/metrics) applies.
  - job_name: anomaly-detector
    static_configs:
      - targets: ["anomaly-detector:8082"]

  - job_name: forecasting
    static_configs:
      - targets: ["forecasting:8083"]

  - job_name: rl-engine
    static_configs:
      - targets: ["rl-engine:8084"]

  - job_name: autoscaler
    static_configs:
      - targets: ["autoscaler:8085"]

  - job_name: policy-manager
    static_configs:
      - targets: ["policy-manager:8086"]

  - job_name: lb-sidecar
    static_configs:
      - targets: ["lb-sidecar:8087"]

  # telemetry has no run loop / publish surface yet — scrape /health as a
  # connectivity check until it grows own-metrics.
  - job_name: telemetry
    metrics_path: /health
    static_configs:
      - targets: ["telemetry:8081"]
