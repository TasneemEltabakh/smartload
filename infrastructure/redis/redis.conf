# SmartLoad Redis configuration
# Used as the async control bus (Pub/Sub) between decision modules.
# Persistence is disabled — the control bus carries live signals, not durable state.

# Disable RDB snapshots
save ""

# Disable AOF persistence
appendonly no

# Memory limit and eviction policy
maxmemory 256mb
maxmemory-policy allkeys-lru

# Bind to all interfaces inside the container
bind 0.0.0.0

# Default port
port 6379

# Disable protected-mode (safe inside Docker network)
protected-mode no
