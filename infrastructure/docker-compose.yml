services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - test-server
    restart: unless-stopped

  test-server:
    build:
      context: ../servers
    environment:
      - PORT=8080
    expose:
      - "8080"
    restart: unless-stopped

  anomaly-detector:
    build:
      context: ../services/anomaly-detector
    environment:
      - PORT=8080
      - SERVICE_NAME=anomaly-detector
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=smartload.anomaly.status
      - TELEMETRY_FILE=/app/data/telemetry_stream.json
    ports:
      - "8081:8080"
    depends_on:
      - redis
    restart: unless-stopped

  traffic-simulator:
    build:
      context: ../traffic-simulator
    ports:
      - "8089:8089"
    depends_on:
      - nginx
    restart: unless-stopped
