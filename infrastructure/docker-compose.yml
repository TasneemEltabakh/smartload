services:

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - test-server
    restart: unless-stopped

  test-server:
    build:
      context: ../servers
    environment:
      - PORT=8080
    expose:
      - "8080"
    restart: unless-stopped

  traffic-simulator:
    build:
      context: ../traffic-simulator
    ports:
      - "8089:8089"
    depends_on:
      - nginx
    restart: unless-stopped