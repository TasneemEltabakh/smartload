services:
  # ==================== EXISTING SERVICES ====================
  
  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - test-server
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - smartload

  nginx-metrics-exporter:
    build:
      context: ./nginx-metrics-exporter
    ports:
      - "9113:9113"
    environment:
      - METRICS_PORT=9113
      - SERVICE_NAME=nginx-lb
      - INSTANCE_ID=nginx-001
      - NODE_ID=a0000000-0000-0000-0000-000000000001
      - SOURCE=real
      - ENVIRONMENT=development
      - NGINX_CONTAINER_NAME=infrastructure-nginx-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - smartload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9113/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  test-server:
    build:
      context: ../servers
    environment:
      - PORT=8080
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - smartload

  traffic-simulator:
    build:
      context: ../traffic-simulator
    ports:
      - "8089:8089"
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - smartload

  # ==================== NEW SERVICES ====================

  # TimescaleDB: Time-series database for metrics storage
  # ─── Issue #10: TimescaleDB — Time-Series Metrics Storage ───────────────────
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: infrastructure-timescaledb-1
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres123     # ⚠️ override via .env in production
      POSTGRES_DB:       postgres
      PGDATA:            /var/lib/postgresql/data/pgdata
      TIMESCALEDB_TELEMETRY: "off"       # opt-out of upstream telemetry
    ports:
      - "5432:5432"
    volumes:
      - ./timescaledb/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ./timescaledb/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
      - timescaledb-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - smartload
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # OpenTelemetry Collector: Receives metrics and stores in DB
  otel-collector:
    build:
      context: ./otel-collector
    container_name: infrastructure-otel-collector-1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      # Collector telemetry (internal metrics)
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      GOGC: "85"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
    depends_on:
      - timescaledb
      - nginx-metrics-exporter
      - timescaledb-ingester
    restart: unless-stopped
    networks:
      - smartload
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TimescaleDB Ingester: Lightweight HTTP service to write metrics to DB
  timescaledb-ingester:
    build:
      context: ./timescaledb-ingester
    container_name: infrastructure-timescaledb-ingester-1
    ports:
      - "5555:5555"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123    # ⚠️ CHANGE IN PRODUCTION
      DB_NAME: smartload
      LOG_LEVEL: INFO
    depends_on:
      - timescaledb
    restart: unless-stopped
    networks:
      - smartload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Issue #12: Grafana Dashboard ───────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: infrastructure-grafana-1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: smartload123   # ⚠️ override via .env in production
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smartload-telemetry.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for persistent data
volumes:
  timescaledb-data:
    driver: local
  grafana-data:
    driver: local

# Network for service communication
networks:
  smartload:
    driver: bridge