# SmartLoad — Grafana datasource auto-provisioning
# Grafana loads this on startup; no manual UI configuration needed.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: smartloaddb
    user: postgres
    secureJsonData:
      password: "${TIMESCALEDB_PASSWORD}"
    jsonData:
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
