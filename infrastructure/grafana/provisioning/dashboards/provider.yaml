# infrastructure/grafana/provisioning/dashboards/provider.yaml
apiVersion: 1

providers:
  - name: SmartLoad
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false