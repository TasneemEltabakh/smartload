worker_processes 1;

events {
    worker_connections 1024;
}

http {

    log_format smartload_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"service":"nginx",'
    '"client_ip":"$remote_addr",'
    '"request":"$request",'
    '"request_path":"$uri",'
    '"status":$status,'
    '"backend":"$upstream_addr",'
    '"latency":$request_time,'
    '"upstream_latency":"$upstream_response_time"'
    '}';

    # Log ONLY to stdout - metrics exporter will read via Docker logs
    access_log /dev/stdout smartload_json;

    upstream backend_pool {
        server test-server:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_pool;

            proxy_next_upstream error timeout http_502 http_503 http_504;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # SmartLoad contract: add node header (Section 2.1.3)
            add_header X-SmartLoad-Node $upstream_addr always;
            
            # SmartLoad contract: backend timeout 30s (Section 2.1.3)
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
        }

        # Health check endpoint for the load balancer itself
        # SmartLoad contract: health endpoint (Section 2.4.2)
        location /health {
            access_log off;
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }
    }

}