worker_processes 1;

events {
    worker_connections 1024;
}

http {

    log_format smartload_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"service":"nginx",'
    '"client_ip":"$remote_addr",'
    '"request":"$request",'
    '"request_path":"$uri",'
    '"status":$status,'
    '"backend":"$upstream_addr",'
    '"latency":$request_time,'
    '"upstream_latency":"$upstream_response_time"'
    '}';

    access_log /dev/stdout            smartload_json;
    # Second sink consumed by the lb-otel-shipper sidecar on the shared
    # `nginx-logs` volume. Per SOT §8.1.1 the shipper tails this file and
    # emits one OTLP/HTTP-JSON gauge data point per request — preserving
    # per-request fidelity for the AI engines' STDDEV/MAX queries.
    #
    # Path is /nginx-logs/access.log (NOT /var/log/nginx/access.log) because
    # the nginx:alpine base image symlinks /var/log/nginx/access.log to
    # /dev/stdout — a stream the shipper cannot seek/tail.
    access_log /nginx-logs/access.log smartload_json;

    # Open-source NGINX doesn't round-robin across A records when
    # `proxy_pass` uses a variable, and doesn't support the Plus-only
    # `server ... resolve` directive for dynamic upstream membership.
    # Enumerate the docker-compose replicas explicitly so the in-block
    # round-robin actually distributes requests across them.
    #
    # Range matches `config/policy.yaml:max_backends` (5). The autoscaler
    # (T1.3) toggles backends 1..5 between running/stopped — NGINX still
    # has all 5 names in its upstream block, and `proxy_next_upstream`
    # retries past whichever ones are currently stopped. T2.1 will replace
    # this static block with a sidecar-regenerated one.
    upstream backend_pool {
        server smartload-test-backend-1:8080 max_fails=3 fail_timeout=10s;
        server smartload-test-backend-2:8080 max_fails=3 fail_timeout=10s;
        server smartload-test-backend-3:8080 max_fails=3 fail_timeout=10s;
        server smartload-test-backend-4:8080 max_fails=3 fail_timeout=10s;
        server smartload-test-backend-5:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        # Static health response — NGINX itself is up if this returns.
        # Backend pool health is reported separately by anomaly-detector
        # (smartload.anomaly) and surfaced on the operator UI Audit page.
        #
        # Exact-match `=` so only `/health` is intercepted; every other
        # path including `/healthz` or `/health/x` still falls through to
        # the proxy below.
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"load-balancer"}';
        }

        location / {
            proxy_pass http://backend_pool;

            proxy_next_upstream error timeout http_502 http_503 http_504;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

}
