worker_processes 1;

events {
    worker_connections 1024;
}

http {

    log_format smartload_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"service":"nginx",'
    '"client_ip":"$remote_addr",'
    '"request":"$request",'
    '"request_path":"$uri",'
    '"status":$status,'
    '"backend":"$upstream_addr",'
    '"latency":$request_time,'
    '"upstream_latency":"$upstream_response_time"'
    '}';

    access_log /dev/stdout            smartload_json;
    # Second sink consumed by the lb-otel-shipper sidecar on the shared
    # `nginx-logs` volume. Per SOT §8.1.1 the shipper tails this file and
    # emits one OTLP/HTTP-JSON gauge data point per request — preserving
    # per-request fidelity for the AI engines' STDDEV/MAX queries.
    #
    # Path is /nginx-logs/access.log (NOT /var/log/nginx/access.log) because
    # the nginx:alpine base image symlinks /var/log/nginx/access.log to
    # /dev/stdout — a stream the shipper cannot seek/tail.
    access_log /nginx-logs/access.log smartload_json;

    # Open-source NGINX doesn't round-robin across A records when
    # `proxy_pass` uses a variable, and doesn't support the Plus-only
    # `server ... resolve` directive for dynamic upstream membership.
    # Enumerate the 12 docker-compose replicas explicitly so the in-block
    # round-robin actually distributes requests across them. If the
    # replica count changes, this list must be regenerated (out of scope
    # for SmartLoad's fixed 12-backend test bed).
    upstream backend_pool {
        server smartload-test-backend-1:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-2:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-3:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-4:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-5:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-6:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-7:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-8:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-9:8080  max_fails=3 fail_timeout=10s;
        server smartload-test-backend-10:8080 max_fails=3 fail_timeout=10s;
        server smartload-test-backend-11:8080 max_fails=3 fail_timeout=10s;
        server smartload-test-backend-12:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_pool;

            proxy_next_upstream error timeout http_502 http_503 http_504;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

}