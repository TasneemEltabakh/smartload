worker_processes 1;

events {
    worker_connections 1024;
}

http {

    # Re-resolve upstream hostnames at request time via Docker's embedded DNS
    # (127.0.0.11) rather than pinning the IP once at config-load. The pool is
    # dynamic: the autoscaler starts/stops/replaces backends, so a recycled
    # container gets a new IP and the old one goes dead. Without this nginx
    # keeps connecting to the cached dead IP (connect() failed / 502) until a
    # clean reload, and a reload itself `[emerg]`-fails if any named upstream
    # host is currently absent. `valid=10s` caps how long a resolved record is
    # cached; ipv6=off keeps lookups to A records (backends are IPv4-only).
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format smartload_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"service":"nginx",'
    '"client_ip":"$remote_addr",'
    '"request":"$request",'
    '"request_path":"$uri",'
    '"status":$status,'
    '"backend":"$upstream_addr",'
    '"latency":$request_time,'
    '"upstream_latency":"$upstream_response_time"'
    '}';

    access_log /dev/stdout            smartload_json;
    # Second sink consumed by the lb-otel-shipper sidecar on the shared
    # `nginx-logs` volume. Per SOT §8.1.1 the shipper tails this file and
    # emits one OTLP/HTTP-JSON gauge data point per request — preserving
    # per-request fidelity for the AI engines' STDDEV/MAX queries.
    #
    # Path is /nginx-logs/access.log (NOT /var/log/nginx/access.log) because
    # the nginx:alpine base image symlinks /var/log/nginx/access.log to
    # /dev/stdout — a stream the shipper cannot seek/tail.
    access_log /nginx-logs/access.log smartload_json;

    # Upstream weights are managed dynamically by the lb-sidecar (T2.1).
    # The sidecar writes /etc/nginx/conf.d/upstream.conf (shared via the
    # nginx-conf Docker volume) and triggers `nginx -s reload` via Docker exec.
    # The initial upstream.conf (committed to services/load-balancer/nginx/conf.d/)
    # seeds equal weights so NGINX starts correctly before the sidecar is ready.
    include /etc/nginx/conf.d/upstream.conf;

    server {
        listen 80;

        # Static health response — NGINX itself is up if this returns.
        # Backend pool health is reported separately by anomaly-detector
        # (smartload.anomaly) and surfaced on the operator UI Audit page.
        #
        # Exact-match `=` so only `/health` is intercepted; every other
        # path including `/healthz` or `/health/x` still falls through to
        # the proxy below.
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"load-balancer"}';
        }

        location / {
            # Variable proxy_pass defers upstream name resolution to request
            # time (using the `resolver` above) instead of pinning the IP at
            # config-load. This keeps the existing `upstream backend_pool`
            # weighting/`down;` scheme — nginx still selects via the upstream
            # group — while no longer stranding on a dead cached IP and no
            # longer `[emerg]`-failing a reload when a named backend is absent.
            set $backend_pool backend_pool;
            proxy_pass http://$backend_pool;

            proxy_next_upstream error timeout http_502 http_503 http_504;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

}
