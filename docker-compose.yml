networks:
  smartload-net:
    driver: bridge

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      POSTGRES_DB: smartloaddb
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartloaddb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smartload-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartload-net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infrastructure/otel-collector/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics endpoint
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - smartload-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
      # Forwarded so the TimescaleDB datasource provisioning yaml can
      # resolve ${TIMESCALEDB_PASSWORD} at Grafana startup. Without this,
      # the datasource is provisioned with an empty password and every
      # dashboard panel fails with SASL auth error.
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - timescaledb
    networks:
      - smartload-net
    restart: unless-stopped

  # ── SmartLoad AI Services ───────────────────────────────────────────────────

  telemetry:
    build:
      # Build from the services/ directory so the canonical shared/
      # module can be copied into the image alongside telemetry/app.py.
      context: ./services
      dockerfile: telemetry/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      SERVICE_NAME: telemetry
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  anomaly-detector:
    build:
      context: ./services
      dockerfile: anomaly-detector/Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      SERVICE_NAME: anomaly-detector
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      # Run loop defaults to off so the Phase-0 stub stays the default until
      # operators flip the flag explicitly. See SOT §8.5 + issue #138.
      ANOMALY_RUNLOOP_ENABLED: ${ANOMALY_RUNLOOP_ENABLED:-false}
      ANOMALY_ENGINE: ${ANOMALY_ENGINE:-threshold}
      ANOMALY_WINDOW_SECONDS: ${ANOMALY_WINDOW_SECONDS:-60}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  forecasting:
    build:
      context: ./services/forecasting
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      SERVICE_NAME: forecasting
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FORECAST_HORIZON_MINUTES: ${FORECAST_HORIZON_MINUTES:-5}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  rl-engine:
    build:
      context: ./services/rl-engine
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      SERVICE_NAME: rl-engine
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RL_MODE: ${RL_MODE:-shadow}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  autoscaler:
    build:
      # Build context is ./services so the Dockerfile can pull in the
      # canonical shared/ module (envelope contracts + SQL constants).
      context: ./services
      dockerfile: autoscaler/Dockerfile
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      SERVICE_NAME: autoscaler
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      POLICY_PATH: /config/policy.yaml
    volumes:
      # Docker socket — autoscaler uses the Docker SDK to start/stop
      # test-backend containers (T1.3). Read-write because container
      # state transitions require write access on the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Policy snapshot for startup config (min_backends, max_backends,
      # per_instance_capacity_rps, autoscaler_cooldown_seconds). Live
      # updates arrive on smartload.policy when policy-manager publishes.
      - ./config/policy.yaml:/config/policy.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  policy-manager:
    build:
      context: ./services
      dockerfile: policy-manager/Dockerfile
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      SERVICE_NAME: policy-manager
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      CONFIG_PATH: /config/policy.yaml
    volumes:
      - ./config/policy.yaml:/config/policy.yaml
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  # ── Traffic Layer ───────────────────────────────────────────────────────────

  load-balancer:
    build:
      context: ./services/load-balancer/nginx
    ports:
      - "8080:80"
    volumes:
      # Second access_log sink (rw). The shipper sidecar reads this volume
      # read-only and emits OTLP. NGINX is unaffected if the shipper dies.
      # Mounted at /nginx-logs (not /var/log/nginx) to avoid the base image's
      # access.log → /dev/stdout symlink.
      - nginx-logs:/nginx-logs
    depends_on:
      # service_healthy (not service_started) so NGINX boots only after
      # every test-backend replica is reachable. Required because the
      # NGINX upstream block enumerates 12 hostnames and aborts at
      # config-load on any unresolved one. See the test-backend
      # healthcheck for the gating condition.
      test-backend:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  # ── LB OTel Shipper (T1.2, SOT §8.1.1) ───────────────────────────────────────
  # Approach B over the F5 nginx-otel module: log-based, preserves per-request
  # fidelity required by STDDEV / MAX queries in services/shared/queries.py.
  lb-otel-shipper:
    build:
      context: ./services/lb-otel-shipper
    environment:
      NGINX_LOG_PATH: /nginx-logs/access.log
      OTEL_COLLECTOR_URL: http://otel-collector:4318/v1/metrics
      SERVICE_NAME: load-balancer
    volumes:
      - nginx-logs:/nginx-logs:ro
    depends_on:
      - load-balancer
      - otel-collector
    networks:
      - smartload-net
    restart: unless-stopped

  test-backend:
    build:
      context: ./test-backends
    environment:
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - smartload-net
    restart: unless-stopped
    # Default replica count matches the 5 `server` entries in
    # services/load-balancer/nginx/nginx.conf and config/policy.yaml's
    # max_backends. Without this, any `docker compose up --build`
    # silently scales test-backend back down to 1, leaving NGINX with
    # 4 dead upstreams at startup. The autoscaler (T1.3) toggles these
    # 5 containers between running/stopped at runtime — it never creates
    # or destroys them, so this is the steady-state count compose owns.
    deploy:
      replicas: 5
    # Required so the load-balancer can wait on `condition:
    # service_healthy` — NGINX's upstream block enumerates
    # smartload-test-backend-1..5 and bails at config-load if any
    # name doesn't resolve, so every replica must exist before NGINX
    # starts. `service_healthy` waits for every replica's healthcheck
    # to pass, which guarantees DNS resolves for the full set.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  traffic-simulator:
    build:
      context: ./tests/performance
    ports:
      - "8089:8089"
    depends_on:
      - load-balancer
    networks:
      - smartload-net
    restart: unless-stopped

  # ── Operator UI (Slice #1) ──────────────────────────────────────────────────
  # Browser-facing control surface. Serves the React frontend at / and proxies
  # /api/ui/* to the upstream SmartLoad services. Mounts the canonical OpenAPI
  # spec read-only so /api/docs renders Swagger UI without rebuilding the image.
  operator-ui:
    build:
      context: ./services/operator-ui
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      SERVICE_NAME: operator-ui
      POLICY_MANAGER_URL:   http://policy-manager:8086
      AUTOSCALER_URL:       http://autoscaler:8085
      TELEMETRY_URL:        http://telemetry:8081
      ANOMALY_DETECTOR_URL: http://anomaly-detector:8082
      FORECASTING_URL:      http://forecasting:8083
      RL_ENGINE_URL:        http://rl-engine:8084
      LOAD_BALANCER_URL:    http://load-balancer:80
    volumes:
      - ./docs/openapi:/app/openapi:ro
    depends_on:
      - policy-manager
      - autoscaler
      - telemetry
      - anomaly-detector
      - forecasting
      - rl-engine
    networks:
      - smartload-net
    restart: unless-stopped

volumes:
  timescaledb-data:
  nginx-logs:
