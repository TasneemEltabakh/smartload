services:

  load-balancer:
    build:
      context: ./services/load-balancer/nginx
    ports:
      - "8080:80"
    depends_on:
      - test-backend
    restart: unless-stopped

  test-backend:
    build:
      context: ./test-backends
    environment:
      - PORT=8080
    expose:
      - "8080"
    restart: unless-stopped

  traffic-simulator:
    build:
      context: ./tests/performance
    ports:
      - "8089:8089"
    depends_on:
      - load-balancer
    restart: unless-stopped
