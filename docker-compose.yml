networks:
  smartload-net:
    driver: bridge

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      POSTGRES_DB: smartloaddb
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartloaddb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smartload-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartload-net
    restart: unless-stopped

  # #116 Redis exporter — surfaces connected_clients, ops/sec, memory used,
  # keyspace hits, and (via -check-keys / -check-streams) per-channel
  # pub/sub depth to Prometheus on :9121. Scraped by prometheus.yml's
  # `redis_exporter` job. Lets us see the control bus's health without
  # exec'ing `redis-cli info` from the host every time.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    command:
      - "--redis.addr=redis://redis:6379"
      - "--log-format=json"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infrastructure/otel-collector/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics endpoint
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - smartload-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
      # Forwarded so the TimescaleDB datasource provisioning yaml can
      # resolve ${TIMESCALEDB_PASSWORD} at Grafana startup. Without this,
      # the datasource is provisioned with an empty password and every
      # dashboard panel fails with SASL auth error.
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      # Embedded-panel embedding for the operator UI (v1.0.7l, #131 Phase 3).
      # ALLOW_EMBEDDING flips X-Frame-Options off so the iframe loads; the
      # AUTH_ANONYMOUS_* set lets the iframe render without a login prompt
      # (the operator UI is single-tenant + assumed-trusted in Phase 1 —
      # auth lands with #125, Phase 2). Viewer role is read-only.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - timescaledb
    networks:
      - smartload-net
    restart: unless-stopped

  # ── SmartLoad AI Services ───────────────────────────────────────────────────

  telemetry:
    build:
      # Build from the services/ directory so the canonical shared/
      # module can be copied into the image alongside telemetry/app.py.
      context: ./services
      dockerfile: telemetry/Dockerfile
    ports:
      - "8081:8081"
    # /health liveness probe (additive — no depends_on changed). Reflects the
    # #163 run-loop liveness verdict; lets dependents gate on service_healthy
    # and `docker compose up --wait` work. Uses python (in the image) + stdlib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      PORT: "8081"
      SERVICE_NAME: telemetry
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  anomaly-detector:
    build:
      context: ./services
      dockerfile: anomaly-detector/Dockerfile
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      PORT: "8082"
      SERVICE_NAME: anomaly-detector
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      # Run loop defaults to off so the Phase-0 stub stays the default until
      # operators flip the flag explicitly. See SOT §8.5 + issue #138.
      ANOMALY_RUNLOOP_ENABLED: ${ANOMALY_RUNLOOP_ENABLED:-true}
      # #3 absolute pool-overload suppression master switch; ablation sets false.
      ANOMALY_ABSOLUTE_OVERLOAD_SUPPRESSION: ${ANOMALY_ABSOLUTE_OVERLOAD_SUPPRESSION:-true}
      # Default engine is `trend_rule`: an interpretable, stateful trend-aware
      # rule engine over per-backend temporal features. It closes the gradual-
      # degradation gap every stateless engine misses (bench F1 0.000 -> 0.845),
      # keeps clean-control false positives at 0.000, needs no model artifact, and
      # -- unlike the IF default reverted in v1.0.7an (#160/#165) -- does not
      # over-exclude: 0.000 clean-control FP + a slope-based recovery suppressor +
      # bounded CUSUM, and the lb-sidecar quorum guard (v1.0.7ap) refuses any
      # exclusion that would empty the pool regardless of engine. Run at
      # flip_confirmation_cycles=2 (the stability-gate sweet spot). `threshold` /
      # `trend_forest` / `isolation_forest` remain selectable; any engine falls
      # back to `threshold` if it can't load.
      ANOMALY_ENGINE: ${ANOMALY_ENGINE:-trend_rule}
      ANOMALY_FLIP_CONFIRMATION_CYCLES: ${ANOMALY_FLIP_CONFIRMATION_CYCLES:-2}
      ANOMALY_WINDOW_SECONDS: ${ANOMALY_WINDOW_SECONDS:-60}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  forecasting:
    build:
      context: ./services
      dockerfile: forecasting/Dockerfile
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      PORT: "8083"
      SERVICE_NAME: forecasting
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FORECAST_HORIZON_MINUTES: ${FORECAST_HORIZON_MINUTES:-5}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      # Run loop defaults to off so the Phase-0 stub stays the default until
      # operators flip the flag explicitly. See SOT §8.6 + issue #138.
      FORECAST_RUNLOOP_ENABLED: ${FORECAST_RUNLOOP_ENABLED:-true}
      # harmonic_residual is the promoted default forecaster: it beats naive,
      # arima and moving_average on MAPE/sMAPE on every load shape with
      # calibrated bands, and is the only engine that converts into a downstream
      # autoscaler SLA win (experiments/forecasting-engine-bench/REPORT.md). Pure
      # NumPy, deterministic, no model artifact. moving_average remains the
      # artifact-free safety fallback if a requested engine fails to construct.
      FORECAST_ENGINE: ${FORECAST_ENGINE:-harmonic_residual}
      FORECAST_WINDOW_MINUTES: ${FORECAST_WINDOW_MINUTES:-60}
      # Scaler-facing look-ahead (forecasting-engine-bench/REPORT.md §6-§7). The
      # lead in 1-min FORECAST_QUERY buckets = FORECAST_HORIZON_MINUTES / 1 = 5,
      # so the published forecast is a true 5-min look-ahead via forecast_ahead;
      # fit_window=120 (local) + robust_mode=downward (asymmetric) are the scaler
      # preset that yields the +6.3 SLA pp downstream win. Engines without
      # forecast_ahead (moving_average, arima) ignore these and stay single-step.
      FORECAST_LEAD_STEPS: ${FORECAST_LEAD_STEPS:-5}
      FORECAST_FIT_WINDOW: ${FORECAST_FIT_WINDOW:-120}
      FORECAST_ROBUST_MODE: ${FORECAST_ROBUST_MODE:-downward}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  rl-engine:
    build:
      context: ./services
      dockerfile: rl-engine/Dockerfile
    # init: true runs tini as PID 1 so zombie child processes are reaped.
    # Required because PPO policy loading forks subprocesses (torch/numpy
    # workers) that can become zombies if the parent exits abnormally.
    init: true
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      PORT: "8084"
      SERVICE_NAME: rl-engine
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RL_MODE: ${RL_MODE:-shadow}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      # Run loop defaults to off so the Phase-0 stub stays the default
      # until operators flip the flag explicitly. See SOT §8.7 + issue #138.
      RL_RUNLOOP_ENABLED: ${RL_RUNLOOP_ENABLED:-true}
      # monotone = the latency-monotone capacity-aware router (candidate_mono):
      # beats the PPO bandit + every classical baseline on the closed-loop sim and
      # the real HTTP stack, passes the monotonicity probe, sheds 0%. Safe as the
      # compose default because RL_MODE defaults to `shadow` above — a fresh stack
      # runs it observe-only until an operator opts into active.
      RL_POLICY: ${RL_POLICY:-monotone}
      RL_WINDOW_SECONDS: ${RL_WINDOW_SECONDS:-30}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  autoscaler:
    build:
      # Build context is ./services so the Dockerfile can pull in the
      # canonical shared/ module (envelope contracts + SQL constants).
      context: ./services
      dockerfile: autoscaler/Dockerfile
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      PORT: "8085"
      SERVICE_NAME: autoscaler
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      POLICY_PATH: /config/policy.yaml
      # Scaling controller. `target` = controllers.decide_target (multi-step
      # headroom sizing + asymmetric cooldown + scale-in deadband): 98.3% SLA with
      # the moving-average signal and 99.2% with the forward forecast, vs the ±1
      # `step` rule's ~77% (experiments/autoscaler-strategy-bench/REPORT.md §8).
      # The preset knobs default to the bench-recommended values in app.py
      # (headroom 0.15, scale_out_cooldown 0, scale_in_cooldown 120, max_step_in 1,
      # deadband 0.15); set AUTOSCALER_CONTROLLER=step to fall back to the ±1 rule.
      AUTOSCALER_CONTROLLER: ${AUTOSCALER_CONTROLLER:-target}
      # Dynamic-pool provisioning (#155 adaptive bench). ON by default so the
      # closed loop can grow a dynamic pool past the compose floor under
      # sustained load; with it off, scale-out can only re-toggle the fixed
      # compose backends and never provisions new ones. Set
      # AUTOSCALER_PROVISIONING_ENABLED=false to fall back to the toggle-only
      # path over the compose-provisioned backends.
      AUTOSCALER_PROVISIONING_ENABLED: ${AUTOSCALER_PROVISIONING_ENABLED:-true}
      AUTOSCALER_PROVISIONING_IMAGE:   ${AUTOSCALER_PROVISIONING_IMAGE:-smartload-test-backend:latest}
      AUTOSCALER_PROVISIONING_NETWORK: ${AUTOSCALER_PROVISIONING_NETWORK:-smartload_smartload-net}
      AUTOSCALER_PROVISIONING_HEALTHCHECK_TIMEOUT_SECONDS: ${AUTOSCALER_PROVISIONING_HEALTHCHECK_TIMEOUT_SECONDS:-30}
    volumes:
      # Docker socket — autoscaler uses the Docker SDK to start/stop
      # test-backend containers AND (#155, when provisioning is enabled)
      # to create / destroy dynamic ones. Read-write because container
      # state transitions require write access on the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Policy snapshot for startup config (min_backends, max_backends,
      # per_instance_capacity_rps, autoscaler_cooldown_seconds). Live
      # updates arrive on smartload.policy when policy-manager publishes.
      - ./config/policy.yaml:/config/policy.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  policy-manager:
    build:
      context: ./services
      dockerfile: policy-manager/Dockerfile
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      PORT: "8086"
      SERVICE_NAME: policy-manager
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TIMESCALEDB_URL: ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      CONFIG_PATH: /config/policy.yaml
    volumes:
      - ./config/policy.yaml:/config/policy.yaml
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  # ── Traffic Layer ───────────────────────────────────────────────────────────

  load-balancer:
    build:
      context: ./services/load-balancer/nginx
    ports:
      - "8080:80"
    volumes:
      # Second access_log sink (rw). The shipper sidecar reads this volume
      # read-only and emits OTLP. NGINX is unaffected if the shipper dies.
      # Mounted at /nginx-logs (not /var/log/nginx) to avoid the base image's
      # access.log → /dev/stdout symlink.
      - nginx-logs:/nginx-logs
      # Shared upstream.conf written by lb-sidecar (T2.1). NGINX reads it via
      # `include /etc/nginx/conf.d/upstream.conf;`. The initial conf seeds equal
      # weights so NGINX starts before the sidecar is ready.
      - nginx-conf:/etc/nginx/conf.d
    depends_on:
      # service_healthy (not service_started) so NGINX boots only after
      # every test-backend replica is reachable. Required because the
      # NGINX upstream block enumerates 12 hostnames and aborts at
      # config-load on any unresolved one. See the test-backend
      # healthcheck for the gating condition.
      test-backend:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

  # ── LB OTel Shipper (T1.2, SOT §8.1.1) ───────────────────────────────────────
  # Approach B over the F5 nginx-otel module: log-based, preserves per-request
  # fidelity required by STDDEV / MAX queries in services/shared/queries.py.
  lb-otel-shipper:
    build:
      context: ./services/lb-otel-shipper
    environment:
      NGINX_LOG_PATH: /nginx-logs/access.log
      OTEL_COLLECTOR_URL: http://otel-collector:4318/v1/metrics
      SERVICE_NAME: load-balancer
    volumes:
      - nginx-logs:/nginx-logs:ro
    depends_on:
      - load-balancer
      - otel-collector
    networks:
      - smartload-net
    restart: unless-stopped

  # ── Resource Collector (host-resource shipper, SOT §8.1.2) ───────────────────
  # Polls the Docker Engine stats API for every SmartLoad container and emits
  # cpu_percent / memory_used_bytes / memory_limit_bytes / memory_percent gauges
  # on the same OTLP → collector → telemetry `metrics` pipeline as the
  # access-log shipper. Fills the per-backend / per-service CPU + memory gap the
  # NGINX access log cannot see. The socket is bind-mounted :ro and the code
  # only ever calls containers.list()/stats() — but note :ro on a unix socket
  # marks the socket *file* read-only, it does NOT gate the Docker API (any
  # docker.sock access is root-equivalent on the host). Least privilege is
  # enforced by the code path, not the mount flag.
  resource-collector:
    build:
      context: ./services/resource-collector
    environment:
      OTEL_COLLECTOR_URL: http://otel-collector:4318/v1/metrics
      SERVICE_NAME: resource-collector
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-smartload}
      POLL_INTERVAL_S: ${RESOURCE_POLL_INTERVAL_S:-15}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - otel-collector
    networks:
      - smartload-net
    restart: unless-stopped

  test-backend:
    build:
      context: ./test-backends
    environment:
      PORT: "8080"
      DEMO_TOKEN: ${DEMO_TOKEN:-}
      # ── Closed-loop service model (test-backends/app.js + lib/config.js) ────
      # Each replica is now a small M/G/c queue rather than a constant-delay
      # echo: WORKERS concurrent service slots, a bounded QUEUE_MAX FIFO, and a
      # 503 shed once the queue is full. Per-request service time is drawn from
      # SERVICE_DIST (constant|exponential|lognormal) with mean SERVICE_MEAN_MS
      # and coefficient-of-variation SERVICE_CV, so observed latency rises with
      # load instead of being flat. SERVICE_SEED is XOR-folded with each
      # replica's id, so the five containers sharing this env still draw
      # independent-but-reproducible streams. Every default below equals the
      # in-code default (lib/config.js) — override only to move the saturation
      # operating point for an experiment; leaving them unset changes nothing.
      SERVICE_MEAN_MS: ${SERVICE_MEAN_MS:-20}
      SERVICE_DIST: ${SERVICE_DIST:-lognormal}
      SERVICE_CV: ${SERVICE_CV:-1}
      SERVICE_SEED: ${SERVICE_SEED:-1337}
      WORKERS: ${BACKEND_WORKERS:-2}
      QUEUE_MAX: ${BACKEND_QUEUE_MAX:-64}
      CPU_BOUND: ${BACKEND_CPU_BOUND:-false}
      # SLOW_HOSTNAME / SLOW_DELAY_MS are intentionally NOT set here.
      # Docker scaled services don't get unique kernel hostnames (they
      # all see the short container ID), so a hostname-match wouldn't
      # work cleanly across the 5 replicas. The benchmark harness
      # (experiments/baseline-vs-smartload/scripts/run_experiment.sh)
      # achieves backend heterogeneity at runtime instead — it POSTs
      # /_admin/delay {ms: BASELINE_SLOW_MS} on backend-1 during set-up
      # and clears it during tear-down. To make any single backend
      # statically slow without the bench harness, split this scaled
      # service into named services + set SLOW_HOSTNAME explicitly.
    expose:
      - "8080"
    networks:
      - smartload-net
    restart: unless-stopped
    # Default replica count matches the 5 `server` entries in
    # services/load-balancer/nginx/nginx.conf and config/policy.yaml's
    # max_backends. Without this, any `docker compose up --build`
    # silently scales test-backend back down to 1, leaving NGINX with
    # 4 dead upstreams at startup. The autoscaler (T1.3) toggles these
    # 5 containers between running/stopped at runtime — it never creates
    # or destroys them, so this is the steady-state count compose owns.
    deploy:
      replicas: 5
    # Required so the load-balancer can wait on `condition:
    # service_healthy` — NGINX's upstream block enumerates
    # smartload-test-backend-1..5 and bails at config-load if any
    # name doesn't resolve, so every replica must exist before NGINX
    # starts. `service_healthy` waits for every replica's healthcheck
    # to pass, which guarantees DNS resolves for the full set.
    #
    # Probe /health, NOT /: under the closed-loop model `/` goes through the
    # worker pool and sheds 503 when saturated, which would flap a
    # busy-but-healthy replica to `unhealthy` and pull it from the LB. /health
    # is fast and unpooled, so the check reflects liveness, not load.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  traffic-simulator:
    build:
      context: ./tools/traffic-simulator
    ports:
      - "8089:8089"
    depends_on:
      - load-balancer
    networks:
      - smartload-net
    restart: unless-stopped

  # ── Operator UI (Slice #1) ──────────────────────────────────────────────────
  # Browser-facing control surface. Serves the React frontend at / and proxies
  # /api/ui/* to the upstream SmartLoad services. Mounts the canonical OpenAPI
  # spec read-only so /api/docs renders Swagger UI without rebuilding the image.
  lb-sidecar:
    build:
      context: ./services
      dockerfile: lb-sidecar/Dockerfile
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      PORT: "8087"
      SERVICE_NAME: lb-sidecar
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NGINX_CONTAINER: ${NGINX_CONTAINER:-smartload-load-balancer-1}
      NGINX_CONF_PATH: /nginx-conf/upstream.conf
      LB_SIDECAR_RUNLOOP_ENABLED: ${LB_SIDECAR_RUNLOOP_ENABLED:-true}
      # Anti-concentration routing-skew floor (0.75 ⇒ skew ≤1.33:1); ablation sets 0.
      LB_SIDECAR_CLAMP_MIN_FRACTION: ${LB_SIDECAR_CLAMP_MIN_FRACTION:-0.75}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      # ALL_BACKENDS is now a COLD-BOOT SEED only — used until the Docker
      # daemon is reachable + discover_all_backends() returns a live list
      # (typically within 1 s of sidecar start). The runtime backend set
      # is discovered via Docker label query on every Redis message so
      # backends provisioned dynamically by the autoscaler (#155) appear
      # in upstream.conf within one cache window (2 s default).
      ALL_BACKENDS: >-
        smartload-test-backend-1:8080,smartload-test-backend-2:8080,
        smartload-test-backend-3:8080,smartload-test-backend-4:8080,
        smartload-test-backend-5:8080
    volumes:
      - nginx-conf:/nginx-conf
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - load-balancer
    networks:
      - smartload-net
    restart: unless-stopped

  operator-ui:
    build:
      # Widened to ./services so the Dockerfile can pull in services/shared/
      # alongside operator-ui/ (the BFF imports shared.contracts.parse_envelope
      # for the Live Engines stream — #121).
      context: ./services
      dockerfile: operator-ui/Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      SERVICE_NAME: operator-ui
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379}
      POLICY_MANAGER_URL:   http://policy-manager:8086
      AUTOSCALER_URL:       http://autoscaler:8085
      TELEMETRY_URL:        http://telemetry:8081
      ANOMALY_DETECTOR_URL: http://anomaly-detector:8082
      FORECASTING_URL:      http://forecasting:8083
      RL_ENGINE_URL:        http://rl-engine:8084
      LB_SIDECAR_URL:       http://lb-sidecar:8087
      LOAD_BALANCER_URL:    http://load-balancer:80
      # Surfaced by /api/ui/policy/environment so the Policy page can render
      # the deployment scope without a live upstream. Defaults keep dev /
      # CI working without an explicit .env entry.
      SMARTLOAD_ENV:            ${SMARTLOAD_ENV:-production}
      SMARTLOAD_AVAILABLE_ENVS: ${SMARTLOAD_AVAILABLE_ENVS:-dev,staging,prod}
    volumes:
      - ./docs/openapi:/app/openapi:ro
      - ./docs/asyncapi:/app/asyncapi:ro
    depends_on:
      - redis
      - policy-manager
      - autoscaler
      - telemetry
      - anomaly-detector
      - forecasting
      - rl-engine
      - lb-sidecar
    networks:
      - smartload-net
    restart: unless-stopped

  # Developer end-to-end validation harness — separate from the operator-ui.
  # Scenario injection, chaos, live event stream (SSE).  Port 8091.
  demo-ui:
    build:
      context: ./tools/demo-ui
    ports:
      - "8091:8091"
    environment:
      PORT: "8091"
      SERVICE_NAME: demo-ui
      POLICY_MANAGER_URL:   http://policy-manager:8086
      ANOMALY_DETECTOR_URL: http://anomaly-detector:8082
      FORECASTING_URL:      http://forecasting:8083
      RL_ENGINE_URL:        http://rl-engine:8084
      AUTOSCALER_URL:       http://autoscaler:8085
      TELEMETRY_URL:        http://telemetry:8081
      LB_SIDECAR_URL:       http://lb-sidecar:8087
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379}
      TIMESCALEDB_URL:      ${TIMESCALEDB_URL:-postgresql://postgres:changeme@timescaledb:5432/smartloaddb}
      TRAFFIC_SIMULATOR_URL: http://traffic-simulator:8089
      DEMO_TOKEN:           ${DEMO_TOKEN:-}
      BACKEND_URLS: >-
        smartload-test-backend-1:8080,smartload-test-backend-2:8080,
        smartload-test-backend-3:8080,smartload-test-backend-4:8080,
        smartload-test-backend-5:8080
      # Read-only paths inside the container where the demo-ui BFF reads the
      # benchmark run outputs surfaced on the Benchmarks page. Each maps via a
      # volume mount below from experiments/.../results/ on the host:
      #   BENCHMARK_RESULTS_DIR — baseline-vs-smartload suite (#148)
      #   ADAPTIVE_RESULTS_DIR  — adaptive-bench suite (#156/#157, RQ4)
      BENCHMARK_RESULTS_DIR: /benchmark-results
      ADAPTIVE_RESULTS_DIR:  /adaptive-results
    volumes:
      - ./experiments/baseline-vs-smartload/results:/benchmark-results:ro
      - ./experiments/adaptive-bench/results:/adaptive-results:ro
    depends_on:
      policy-manager:
        condition: service_started
      anomaly-detector:
        condition: service_started
      rl-engine:
        condition: service_started
      lb-sidecar:
        condition: service_started
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - smartload-net
    restart: unless-stopped

volumes:
  timescaledb-data:
  nginx-logs:
  nginx-conf:
