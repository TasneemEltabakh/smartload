openapi: 3.1.0
info:
  title: SmartLoad API
  version: 1.0.0
  summary: Operating-policy, telemetry, scaling, and audit API for the SmartLoad stack.
  description: |
    Canonical contract for the SmartLoad HTTP surface. Every shipped
    `/api/v1/*` route appears here. Generated client SDKs (`smartload-client`
    for Python) and the operator UI both consume this spec.

    Stability: every breaking change requires a path-version bump
    (`/api/v2`) and a `Sunset` header on the deprecated version. See SOT
    §11.5 (versioning policy).
servers:
  - url: http://localhost:8086
    description: policy-manager (local dev)
  - url: http://localhost:8081
    description: telemetry (local dev)

tags:
  - name: policy
    description: Read / write / audit the operating policy
  - name: telemetry
    description: Read recent metric rows
  - name: audit
    description: Append-only audit surface for policy changes
  - name: lb-sidecar
    description: Dynamic upstream weight management (T2.1)
  - name: status
    description: Consolidated read across every service + policy + recent audit rows (slice #149 / OUI.9)

paths:
  /health:
    get:
      summary: Uniform service health
      description: |
        Returns `{ status, redis, timescaledb }`. Returns HTTP 503 on degraded
        per SOT §11; never returns multi-status 207.
      responses:
        '200':
          description: All upstream dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOk'
        '503':
          description: One or more dependencies degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegraded'

  /api/v1/policy:
    get:
      summary: Read the current operating policy
      tags: [policy]
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: policy.yaml missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Propose and commit a policy change
      description: |
        Idempotent. A POST whose body matches the on-disk state returns
        `{"status": "no-op", ...}` with no audit row and no envelope publish.
      tags: [policy]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
          description: Logical actor name persisted in the audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyPatch'
      responses:
        '200':
          description: Change accepted (or idempotent no-op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyUpdateResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/policy/strategy:
    post:
      summary: Apply a named load-balancing strategy
      description: |
        Translates an industry-vocabulary strategy name to the underlying
        policy primitives (`operating_mode` + `safe_mode` only) and applies them
        through the same path as `POST /api/v1/policy` — same validation, audit
        row, and `smartload.policy` envelope.

        Idempotent like `POST /api/v1/policy`. The response surfaces the
        recommended deploy-time `RL_MODE` env pin for the chosen strategy
        (`recommended_rl_mode`); `RL_MODE` is never set as a policy field.

        Unknown names return 400 with `field=name` and an `allowed_strategies`
        list. Actor precedence: `X-Actor` header, then body `actor`, then
        `anonymous`.
      tags: [policy]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
          description: Logical actor name persisted in the audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyRequest'
      responses:
        '200':
          description: Strategy applied (or idempotent no-op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyResponse'
        '400':
          description: Unknown strategy name or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/audit/policy:
    get:
      summary: Recent policy-change audit rows
      description: One row per changed field, newest first.
      tags: [policy, audit]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: Recent audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyAuditRow'
        '400':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Audit datastore unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/audit/scaling:
    get:
      summary: Recent autoscaler-action audit rows
      description: |
        One row per scaling action taken by the autoscaler (scale-out or
        scale-in), newest first. Read-only — the autoscaler writes
        scaling_events when it actuates; this endpoint replays them for
        operators and integrators.

        Lives on the autoscaler service (default port 8085), not on
        policy-manager.
      tags: [autoscaler, audit]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: Recent scaling-event rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScalingAuditRow'
        '400':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Audit datastore unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/scale:
    post:
      summary: Manually scale the backend pool
      description: |
        Operator override on the autoscaler (port 8085). Bypasses the
        forecast subscription and the cooldown timer. Validates the
        requested `target_count` against the live policy's
        `min_backends` / `max_backends` and rejects 400 when out of
        bounds. On success, scales the cluster step-by-step, writes one
        `scaling_events` row with `reason = "manual:<actor>: <reason>"`,
        and publishes one `ScalingEvent` envelope on `smartload.scale`
        (with `forecast_event_id = null` because there is no forecast
        origin).
      tags: [autoscaler]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
          description: |
            Logical actor persisted in the audit row reason. If unset,
            the request body `actor` field is used; if both are unset,
            defaults to `"operator"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualScaleRequest'
      responses:
        '200':
          description: Scale applied (or no-op if target equals current)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualScaleResponse'
        '400':
          description: Target out of bounds or non-integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cluster query or audit write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/isolate:
    post:
      summary: Manually publish an AnomalyEvent for a backend
      description: |
        Operator override on the anomaly-detector (port 8082). Publishes
        a synthetic `AnomalyEvent` envelope on `smartload.anomaly` and
        writes one `backend_health` row. Useful for demoing
        anomaly-driven routing without inducing real backend failures.
      tags: [anomaly-detector]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualIsolateRequest'
      responses:
        '200':
          description: AnomalyEvent published + backend_health written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualIsolateResponse'
        '400':
          description: Missing backend_id or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Envelope publish or backend_health write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/actions/simulate:
    post:
      summary: Dry-run a manual action (scale or isolate)
      description: |
        Preview-before-apply for the manual-action surface (#146). Present on
        BOTH the autoscaler (port 8085) and the anomaly-detector (port 8082);
        each accepts the SAME request body as its real counterpart
        (`POST /api/v1/scale` and `POST /api/v1/isolate` respectively) and runs
        the SAME validation path, so a failed simulate guarantees a failed real
        action with the same 400 + `field`.

        Side-effect free: no cluster change, no `scaling_events` /
        `backend_health` row, no envelope publish, and the autoscaler cooldown
        clock is left untouched.

        The autoscaler returns a `SimulateScaleResponse` (what the scale would
        do, plus the live policy bounds). The anomaly-detector returns a
        `SimulateIsolateResponse` (the synthetic `AnomalyEvent` envelope that
        an isolate would publish, un-published).
      tags: [autoscaler, anomaly-detector]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ManualScaleRequest'
                - $ref: '#/components/schemas/ManualIsolateRequest'
      responses:
        '200':
          description: Dry-run plan (scale preview on autoscaler, isolate envelope on anomaly-detector)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SimulateScaleResponse'
                  - $ref: '#/components/schemas/SimulateIsolateResponse'
        '400':
          description: Same validation error the real action would return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cluster query failed (autoscaler only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/lb/state:
    get:
      summary: Current LB adapter state
      description: |
        Returns the lb-sidecar's in-memory view of the upstream weight table
        and the set of currently-excluded backends (port 8087).
        Returns 503 when the run loop is not enabled or not yet ready.
      tags: [lb-sidecar]
      responses:
        '200':
          description: Current upstream weights and exclusions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LbState'
        '503':
          description: Run loop not enabled or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/lb/weights:
    post:
      summary: Override upstream weights
      description: |
        Operator-supplied weight override. Accepts a JSON object mapping
        backend_id (container_name:port) → integer weight. Rewrites the
        NGINX upstream block immediately. Excluded backends are not affected.
        Lives on the lb-sidecar service (port 8087).
      tags: [lb-sidecar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LbWeightOverride'
      responses:
        '200':
          description: Weights applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LbWeightOverrideResponse'
        '400':
          description: Empty body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Adapter write or nginx reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Run loop not enabled or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/lb/algorithm:
    post:
      summary: Switch NGINX upstream algorithm
      description: |
        Switch the NGINX upstream load-balancing algorithm. Resets every
        server weight to 1 (equal) before writing the new directive so the
        chosen algorithm operates without any prior RL-applied bias. The
        change takes effect on the next `nginx -s reload` triggered by
        the adapter (within the same call).
        Lives on the lb-sidecar service (port 8087).
      tags: [lb-sidecar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LbAlgorithmOverride'
      responses:
        '200':
          description: Algorithm switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LbAlgorithmOverrideResponse'
        '400':
          description: Unsupported algorithm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Adapter write or nginx reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Run loop not enabled or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/metrics:
    get:
      summary: Read recent metric rows
      tags: [telemetry]
      parameters:
        - in: query
          name: service
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, default: '5m' }
      responses:
        '200':
          description: Metric rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricRow'

  /api/v1/metrics/rpm:
    get:
      summary: Per-minute request-rate time series (operator-UI throughput card)
      tags: [telemetry]
      parameters:
        - in: query
          name: window
          description: "Number of 1-minute buckets to return (default 24, cap 240)."
          schema: { type: integer, default: 24, maximum: 240 }
      responses:
        '200':
          description: Request-rate buckets plus the current rpm and raw total. Always 200 (empty buckets on DB failure).
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets: { type: array, items: { type: object, additionalProperties: true } }
                  current_rpm: { type: number }
                  total_requests: { type: integer }

  /api/v1/metrics/latency:
    get:
      summary: p50 / p95 / p99 request latency over a rolling window
      tags: [telemetry]
      parameters:
        - in: query
          name: window
          description: "Window length in seconds (default 60, cap 3600)."
          schema: { type: integer, default: 60, maximum: 3600 }
      responses:
        '200':
          description: "Percentiles in ms (null below a 10-sample floor) plus the sample count. Always 200."
          content:
            application/json:
              schema:
                type: object
                properties:
                  p50_ms: { type: integer, nullable: true }
                  p95_ms: { type: integer, nullable: true }
                  p99_ms: { type: integer, nullable: true }
                  samples: { type: integer }

  /api/v1/metrics/slo:
    get:
      summary: SLO compliance — percent of requests within the p95 latency budget
      tags: [telemetry]
      parameters:
        - in: query
          name: window
          description: "Window length in seconds (default 3600, cap 86400)."
          schema: { type: integer, default: 3600, maximum: 86400 }
        - in: query
          name: slo_p95
          description: "Latency budget in ms to score against (default 200)."
          schema: { type: integer, default: 200 }
      responses:
        '200':
          description: Compliance percent + violation count over the window. Always 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slo_p95_ms: { type: integer }
                  window_seconds: { type: integer }
                  samples: { type: integer }
                  compliant_pct: { type: number }
                  violations: { type: integer }

  /api/v1/metrics/resources:
    get:
      summary: Latest CPU / memory sample per container instance
      tags: [telemetry]
      parameters:
        - in: query
          name: window
          description: "How far back to look for a fresh sample, in seconds (default 120, cap 3600)."
          schema: { type: integer, default: 120, maximum: 3600 }
      responses:
        '200':
          description: One latest CPU/memory record per instance (from the resource-collector daemon). Always 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances: { type: array, items: { type: object, additionalProperties: true } }
                  window_seconds: { type: integer }
                  count: { type: integer }

  /api/v1/metrics/backends:
    get:
      summary: Per-backend request stats (p95 latency, rpm, error rate) plus a pool aggregate
      tags: [telemetry]
      parameters:
        - in: query
          name: window
          description: "Window length in seconds (default 60, cap 3600)."
          schema: { type: integer, default: 60, maximum: 3600 }
      responses:
        '200':
          description: "Per-backend rows (keyed by NGINX upstream instance) plus a grand-total aggregate from one GROUPING SETS scan. Always 200."
          content:
            application/json:
              schema:
                type: object
                properties:
                  backends:
                    type: array
                    items:
                      type: object
                      properties:
                        instance: { type: string }
                        p95_ms: { type: integer, nullable: true }
                        rpm: { type: number }
                        error_rate_pct: { type: number }
                        samples: { type: integer }
                  aggregate: { type: object, nullable: true, additionalProperties: true }
                  window_seconds: { type: integer }

  /api/v1/forecasts:
    get:
      summary: Recent forecast history (operator-UI forecast view)
      description: |
        Served by the forecasting service (port 8083). Returns recent rows from
        the `forecasts` hypertable (newest first) plus the distinct set of
        model_names present in the window. Always returns 200 — a DB failure
        collapses to an empty result so the history view degrades gracefully.
      tags: [forecasting]
      parameters:
        - in: query
          name: window
          description: "How far back to read, in seconds (default 3600, cap 86400)."
          schema: { type: integer, default: 3600, maximum: 86400 }
        - in: query
          name: limit
          description: "Maximum rows to return, newest first (default 500, cap 5000)."
          schema: { type: integer, default: 500, maximum: 5000 }
      responses:
        '200':
          description: Forecast rows plus the distinct model_names in the window. Always 200 (empty result on DB failure).
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecasts:
                    type: array
                    items:
                      type: object
                      properties:
                        time:             { type: string, format: date-time }
                        horizon_minutes:  { type: integer }
                        predicted_rps:    { type: number }
                        confidence_lower: { type: number, nullable: true }
                        confidence_upper: { type: number, nullable: true }
                        model_name:       { type: string }
                        model_version:    { type: string, nullable: true }
                  models:
                    type: array
                    items: { type: string }
                  window_seconds: { type: integer }

  /api/v1/anomaly/history:
    get:
      summary: Recent per-backend anomaly verdict history (operator-UI history view)
      description: |
        Served by the anomaly-detector (port 8082). Returns recent rows from the
        `backend_health` hypertable (newest first), optionally filtered to a
        single backend_id, plus the distinct set of backend_ids present in the
        window. Always returns 200 — a DB failure collapses to an empty result
        so the history view degrades gracefully.
      tags: [anomaly-detector]
      parameters:
        - in: query
          name: window
          description: "How far back to read, in seconds (default 3600, cap 86400)."
          schema: { type: integer, default: 3600, maximum: 86400 }
        - in: query
          name: backend
          description: "Optional backend_id filter (e.g. \"backend_1\"); omit for all backends."
          schema: { type: string }
        - in: query
          name: limit
          description: "Maximum rows to return, newest first (default 500, cap 5000)."
          schema: { type: integer, default: 500, maximum: 5000 }
      responses:
        '200':
          description: Verdict rows plus the distinct backend_ids in the window. Always 200 (empty result on DB failure).
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        time:       { type: string, format: date-time }
                        backend_id: { type: string }
                        status:
                          type: string
                          enum: [healthy, degraded, unhealthy]
                        score:      { type: number }
                  backends:
                    type: array
                    items: { type: string }
                  window_seconds: { type: integer }

  /api/v1/engine/state:
    get:
      summary: Live per-engine state (policy bootstrap, runloop stats, last cycle)
      description: |
        Served by the three decision-plane engines (anomaly-detector,
        forecasting, rl-engine) and read by the operator-UI Live Engines page.
        The exact body varies by engine; rl-engine carries the richest snapshot
        (policy_ready, the operating-policy snapshot, runloop stats, last cycle
        output, and the env-pinned rl_mode). Always returns 200 — a disabled
        runloop is a state, not an error.
      tags: [decision-plane]
      responses:
        '200':
          description: Engine state snapshot (shape varies by engine).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/stats:
    get:
      summary: Telemetry service own-observability counters
      tags: [telemetry]
      responses:
        '200':
          description: Counters describing the telemetry ingest path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryStats'

  /api/v1/status:
    get:
      summary: Consolidated read across every service + active policy + recent audit rows
      description: |
        One-shot aggregate read for programmatic operators. Replaces the
        7-call polling burst (six `/health` + `GET /api/v1/policy`)
        integrators would otherwise need. Hits operator-UI BFF
        (port 8090 in local dev).

        Always returns 200. Per-service failures (timeout, connection
        refused, non-2xx) surface as `{"status": "down"}` in the
        `services` map; the `overall` field rolls them up.

        Fan-out is parallel with a 2 s per-service timeout — a slow
        service can only delay the whole response by that bound.
      tags: [status]
      responses:
        '200':
          description: Aggregated status. Always 200 — even when downstream services are degraded or unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

components:
  schemas:
    HealthOk:
      type: object
      required: [status, service, redis, timescaledb]
      properties:
        status:      { type: string, enum: [ok] }
        service:     { type: string }
        redis:       { type: boolean }
        timescaledb: { type: boolean }
        policy_loaded:  { type: boolean }
        policy_version: { type: integer }
    HealthDegraded:
      type: object
      required: [status, service, redis, timescaledb, errors]
      properties:
        status:      { type: string, enum: [degraded] }
        service:     { type: string }
        redis:       { type: boolean }
        timescaledb: { type: boolean }
        errors:
          type: array
          items: { type: string }

    Policy:
      type: object
      description: |
        Canonical operating policy snapshot. Reflects services/policy-manager
        validation.py; the live validator is authoritative when the spec lags.
      required:
        - operating_mode
        - safe_mode
        - min_backends
        - max_backends
        - slo_p95_latency_ms
        - anomaly_latency_multiplier
        - per_instance_capacity_rps
        - autoscaler_cooldown_seconds
        - policy_version
      properties:
        operating_mode:
          type: string
          enum: [classical-only, hybrid, rl-only]
        safe_mode:                       { type: boolean }
        min_backends:                    { type: integer, minimum: 1 }
        max_backends:                    { type: integer, minimum: 1 }
        slo_p95_latency_ms:              { type: integer, minimum: 1 }
        anomaly_latency_multiplier:      { type: number, minimum: 0 }
        per_instance_capacity_rps:       { type: number, minimum: 0 }
        autoscaler_cooldown_seconds:     { type: number, minimum: 0 }
        policy_version:                  { type: integer, minimum: 0 }
        anomaly_response:
          type: string
          enum: [auto-isolate, advisory]
          default: auto-isolate
        anomaly_recovery_window_seconds: { type: integer, minimum: 1 }
        rl_exploration_rate:             { type: number, minimum: 0, maximum: 1 }
        rl_confidence_threshold:         { type: number, minimum: 0, maximum: 1 }
        strategy_name:
          type: string
          description: |
            Derived on read (#150): the representative named strategy for the
            live operating_mode + safe_mode primitive pair, or "custom" when the
            pair matches no documented strategy. Never persisted. The reverse map
            is many-to-one (latency/forecast/anomaly-aware + ai-hybrid all share
            hybrid + safe_mode=false), so this returns the representative name —
            see docs/features/named-strategies.md.

    PolicyPatch:
      type: object
      description: |
        Any subset of Policy fields. Missing fields keep their current value.
        `policy_version` is server-managed; clients should not send it.
      additionalProperties: true
      properties:
        operating_mode:
          type: string
          enum: [classical-only, hybrid, rl-only]
        safe_mode:                       { type: boolean }
        min_backends:                    { type: integer }
        max_backends:                    { type: integer }
        slo_p95_latency_ms:              { type: integer }
        anomaly_latency_multiplier:      { type: number }
        per_instance_capacity_rps:       { type: number }
        autoscaler_cooldown_seconds:     { type: number }
        anomaly_response:
          type: string
          enum: [auto-isolate, advisory]
        anomaly_recovery_window_seconds: { type: integer }
        rl_exploration_rate:             { type: number }
        rl_confidence_threshold:         { type: number }

    PolicyUpdateResponse:
      type: object
      required: [status, policy, changed_fields, policy_version]
      properties:
        status:
          type: string
          enum: [updated, no-op]
        policy:
          $ref: '#/components/schemas/Policy'
        changed_fields:
          type: array
          items: { type: string }
        policy_version:
          type: integer
        event_id:
          type: [string, "null"]
          description: |
            Envelope event_id published on smartload.policy. Null when the
            publish was skipped (best-effort path).

    StrategyRequest:
      type: object
      required: [name]
      description: |
        Named load-balancing strategy to apply. The name is translated to its
        primitives server-side via shared.config_loader.STRATEGY_PRIMITIVES
        (plus safe-fallback).
      properties:
        name:
          type: string
          enum:
            - round-robin
            - least-connections
            - latency-aware
            - forecast-aware
            - anomaly-aware
            - ai-hybrid
            - safe-fallback
        actor:
          type: string
          description: |
            Logical actor for the audit row. Lower precedence than the X-Actor
            header. Defaults to "anonymous".

    StrategyResponse:
      type: object
      description: |
        Extends the PolicyUpdateResponse shape with the chosen strategy and the
        recommended (never-applied) RL_MODE pin.
      required: [status, policy, changed_fields]
      properties:
        status:
          type: string
          enum: [updated, no-op]
        policy:
          $ref: '#/components/schemas/Policy'
        changed_fields:
          type: array
          items: { type: string }
        policy_version:
          type: integer
        event_id:
          type: [string, "null"]
        strategy:
          type: string
          description: The named strategy that was applied.
        recommended_rl_mode:
          type: [string, "null"]
          enum: [shadow, active, null]
          description: |
            The deploy-time RL_MODE env pin recommended for this strategy.
            Surfaced for the operator; never set as a policy field. Null when the
            strategy does not engage the RL plane.

    PolicyAuditRow:
      type: object
      required: [time, policy_version, field, new_value, actor]
      properties:
        time:           { type: string, format: date-time }
        policy_version: { type: integer }
        field:          { type: string }
        old_value:
          description: Previous value (JSON-decoded). Null on first write of the field.
        new_value:
          description: New value (JSON-decoded).
        actor:
          type: string

    ScalingAuditRow:
      type: object
      required: [time, action, instance_count]
      properties:
        time:           { type: string, format: date-time }
        action:
          type: string
          enum: [scale_out, scale_in]
          description: Direction of the scaling action.
        instance_count:
          type: integer
          description: Resulting backend count after the action.
        reason:
          type: string
          nullable: true
          description: Human-readable justification (e.g. "forecast predicted 450 rps").

    ManualScaleRequest:
      type: object
      required: [target_count]
      properties:
        target_count:
          type: integer
          description: |
            Desired backend count after the action. Must be in
            `[policy.min_backends, policy.max_backends]`.
        actor:
          type: string
          description: |
            Logical actor name. Falls back to the `X-Actor` header, then
            to `"operator"`.
        reason:
          type: string
          description: |
            Free-text justification. Prefixed with `manual:<actor>:` in
            the audited row.

    ManualScaleResponse:
      type: object
      required: [status, action, target_count, previous_count, final_count, steps_actuated, steps_requested, reason, event_id]
      properties:
        status:
          type: string
          enum: [applied, noop]
        action:
          type: string
          enum: [scale_out, scale_in, noop]
        target_count:    { type: integer }
        previous_count:  { type: integer }
        final_count:     { type: integer }
        steps_actuated:  { type: integer }
        steps_requested: { type: integer }
        reason:          { type: string }
        event_id:        { type: string, format: uuid }

    ManualIsolateRequest:
      type: object
      required: [backend_id, status]
      properties:
        backend_id:
          type: string
          description: |
            Backend instance identifier — matches the value the engine
            would publish (e.g. `"backend_1"` or `"172.18.0.5:8080"`).
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        actor:  { type: string }
        reason: { type: string }

    ManualIsolateResponse:
      type: object
      required: [status, backend_id, anomaly_status, score, actor, reason, event_id]
      properties:
        status:         { type: string, enum: [applied] }
        backend_id:     { type: string }
        anomaly_status: { type: string, enum: [healthy, degraded, unhealthy] }
        score:          { type: number }
        actor:          { type: string }
        reason:         { type: string }
        event_id:       { type: string, format: uuid }

    SimulateScaleResponse:
      type: object
      description: |
        Autoscaler dry-run (#146). What POST /api/v1/scale WOULD do, computed
        via the same plan path. No side effects.
      required: [would_execute, current_count, target_count, action, cooldown_remaining_s, would_audit_reason, policy_bounds]
      properties:
        would_execute:
          type: boolean
          description: false when the plan is a no-op (target == current).
        current_count:        { type: integer }
        target_count:         { type: integer }
        action:
          type: string
          enum: [scale_out, scale_in, noop]
        cooldown_remaining_s:
          type: number
          description: Seconds left on the cooldown clock (informational; unchanged by simulate).
        would_audit_reason:
          type: string
          description: "The reason that the real action would persist (`manual:<actor>: <reason>`)."
        policy_bounds:
          type: object
          required: [min_backends, max_backends]
          properties:
            min_backends: { type: integer }
            max_backends: { type: integer }

    SimulateIsolateResponse:
      type: object
      description: |
        Anomaly-detector dry-run (#146). The synthetic AnomalyEvent envelope
        that POST /api/v1/isolate WOULD publish — returned un-published, with
        no backend_health write.
      required: [would_publish, channel, envelope, backend_id, status, severity, reason]
      properties:
        would_publish: { type: boolean, enum: [true] }
        channel:       { type: string, enum: [smartload.anomaly] }
        envelope:
          type: object
          required: [event_id, source, version, timestamp, payload]
          properties:
            event_id:  { type: string, format: uuid }
            source:    { type: string }
            version:   { type: integer }
            timestamp: { type: string, format: date-time }
            payload:   { type: object, additionalProperties: true }
        backend_id: { type: string }
        status:     { type: string, enum: [healthy, degraded, unhealthy] }
        severity:   { type: string, enum: [critical, warning, info] }
        reason:     { type: string }

    MetricRow:
      type: object
      properties:
        time:        { type: string, format: date-time }
        service:     { type: string }
        instance:    { type: string }
        metric_name: { type: string }
        value:       { type: number }

    TelemetryStats:
      type: object
      required: [service, rows_written, batches_written, rows_dropped_db, rows_dropped_shape]
      properties:
        service:            { type: string }
        rows_written:       { type: integer }
        batches_written:    { type: integer }
        rows_dropped_db:    { type: integer }
        rows_dropped_shape: { type: integer }

    LbState:
      type: object
      required: [upstream_weights, excluded_backends]
      properties:
        upstream_weights:
          type: object
          additionalProperties:
            type: integer
          description: Map of backend_id (container:port) → NGINX weight (integer ≥ 1).
        excluded_backends:
          type: array
          items: { type: string }
          description: Backends currently serving no traffic (NGINX `down` directive).

    LbWeightOverride:
      type: object
      additionalProperties:
        type: integer
        minimum: 1
      description: Map of backend_id (container:port) → desired weight.
      example:
        "smartload-test-backend-1:8080": 90
        "smartload-test-backend-2:8080": 50

    LbWeightOverrideResponse:
      type: object
      required: [ok, applied_weights]
      properties:
        ok:              { type: boolean }
        applied_weights:
          type: object
          additionalProperties:
            type: integer

    LbAlgorithmOverride:
      type: object
      required: [algorithm]
      properties:
        algorithm:
          type: string
          enum: [round_robin, least_conn, random]
          description: |
            NGINX-native upstream algorithm. `round_robin` is the default
            and requires no directive. `least_conn` adds `least_conn;` to
            the upstream block (NGINX routes to the backend with the
            fewest active connections). `random` adds `random;` (uniform).
      example:
        algorithm: least_conn

    LbAlgorithmOverrideResponse:
      type: object
      required: [ok, algorithm]
      properties:
        ok:        { type: boolean }
        algorithm: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:   { type: string }
        field:
          type: [string, "null"]
          description: |
            Names the offending field when the server can pinpoint it
            (validation errors). Null otherwise.

    StatusResponse:
      type: object
      required: [generated_at, overall, services, recent]
      properties:
        generated_at:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp at which the BFF assembled the response.
        overall:
          type: string
          enum: [ok, degraded, down]
          description: |
            Rolled-up pill across every service. `ok` if every service
            is ok; `degraded` if any returned a non-ok status from a
            reachable /health; `down` if any was unreachable (timeout,
            connection refused, non-2xx, malformed JSON).
        services:
          type: object
          description: |
            Per-service status keyed by canonical service name
            (policy-manager, autoscaler, telemetry, anomaly-detector,
            forecasting, rl-engine, lb-sidecar, load-balancer). Every
            service returns at least `status`; the remaining fields are
            forwarded verbatim from the service's `/health` body
            (forward-compatible — new /health fields appear automatically).
          additionalProperties:
            $ref: '#/components/schemas/ServiceStatus'
        active_policy:
          oneOf:
            - $ref: '#/components/schemas/ActivePolicySnapshot'
            - type: 'null'
          description: |
            Trimmed view of `GET /api/v1/policy`. Best-effort — null if
            policy-manager was unreachable during the read.
        recent:
          $ref: '#/components/schemas/RecentEvents'

    ServiceStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: |
            "ok" | "degraded" | "down" | other forward-compat values from
            future /health revisions.
        error:
          type: string
          description: Present only when `status=down`. Names the failure (`http_503`, `ConnectError`, `malformed_json`, ...).
      additionalProperties: true

    ActivePolicySnapshot:
      type: object
      properties:
        operating_mode:     { type: [string, "null"] }
        safe_mode:          { type: [boolean, "null"] }
        slo_p95_latency_ms: { type: [integer, "null"] }
        policy_version:     { type: [integer, "null"] }

    RecentEvents:
      type: object
      required: [last_policy_change, last_scaling_event]
      properties:
        last_policy_change:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: |
            Single most recent row from `GET /api/v1/audit/policy?limit=1`
            (best-effort; null on fetch failure). Keys mirror the policy
            audit row shape — actor, field, from, to, at.
        last_scaling_event:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: |
            Single most recent row from `GET /api/v1/audit/scaling?limit=1`
            (best-effort; null on fetch failure). Keys mirror the scaling
            audit row shape — action, instance_count, reason, at.

