openapi: 3.1.0
info:
  title: SmartLoad API
  version: 1.0.0
  summary: Operating-policy, telemetry, scaling, and audit API for the SmartLoad stack.
  description: |
    Canonical contract for the SmartLoad HTTP surface. Every shipped
    `/api/v1/*` route appears here. Generated client SDKs (`smartload-client`
    for Python) and the operator UI both consume this spec.

    Stability: every breaking change requires a path-version bump
    (`/api/v2`) and a `Sunset` header on the deprecated version. See SOT
    §11.5 (versioning policy).
servers:
  - url: http://localhost:8086
    description: policy-manager (local dev)
  - url: http://localhost:8081
    description: telemetry (local dev)

tags:
  - name: policy
    description: Read / write / audit the operating policy
  - name: telemetry
    description: Read recent metric rows
  - name: audit
    description: Append-only audit surface for policy changes
  - name: lb-sidecar
    description: Dynamic upstream weight management (T2.1)

paths:
  /health:
    get:
      summary: Uniform service health
      description: |
        Returns `{ status, redis, timescaledb }`. Returns HTTP 503 on degraded
        per SOT §11; never returns multi-status 207.
      responses:
        '200':
          description: All upstream dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOk'
        '503':
          description: One or more dependencies degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegraded'

  /api/v1/policy:
    get:
      summary: Read the current operating policy
      tags: [policy]
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: policy.yaml missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Propose and commit a policy change
      description: |
        Idempotent. A POST whose body matches the on-disk state returns
        `{"status": "no-op", ...}` with no audit row and no envelope publish.
      tags: [policy]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
          description: Logical actor name persisted in the audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyPatch'
      responses:
        '200':
          description: Change accepted (or idempotent no-op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyUpdateResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/audit/policy:
    get:
      summary: Recent policy-change audit rows
      description: One row per changed field, newest first.
      tags: [policy, audit]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: Recent audit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyAuditRow'
        '400':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Audit datastore unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/audit/scaling:
    get:
      summary: Recent autoscaler-action audit rows
      description: |
        One row per scaling action taken by the autoscaler (scale-out or
        scale-in), newest first. Read-only — the autoscaler writes
        scaling_events when it actuates; this endpoint replays them for
        operators and integrators.

        Lives on the autoscaler service (default port 8085), not on
        policy-manager.
      tags: [autoscaler, audit]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: Recent scaling-event rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScalingAuditRow'
        '400':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Audit datastore unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/scale:
    post:
      summary: Manually scale the backend pool
      description: |
        Operator override on the autoscaler (port 8085). Bypasses the
        forecast subscription and the cooldown timer. Validates the
        requested `target_count` against the live policy's
        `min_backends` / `max_backends` and rejects 400 when out of
        bounds. On success, scales the cluster step-by-step, writes one
        `scaling_events` row with `reason = "manual:<actor>: <reason>"`,
        and publishes one `ScalingEvent` envelope on `smartload.scale`
        (with `forecast_event_id = null` because there is no forecast
        origin).
      tags: [autoscaler]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
          description: |
            Logical actor persisted in the audit row reason. If unset,
            the request body `actor` field is used; if both are unset,
            defaults to `"operator"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualScaleRequest'
      responses:
        '200':
          description: Scale applied (or no-op if target equals current)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualScaleResponse'
        '400':
          description: Target out of bounds or non-integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cluster query or audit write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/isolate:
    post:
      summary: Manually publish an AnomalyEvent for a backend
      description: |
        Operator override on the anomaly-detector (port 8082). Publishes
        a synthetic `AnomalyEvent` envelope on `smartload.anomaly` and
        writes one `backend_health` row. Useful for demoing
        anomaly-driven routing without inducing real backend failures.
      tags: [anomaly-detector]
      parameters:
        - in: header
          name: X-Actor
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualIsolateRequest'
      responses:
        '200':
          description: AnomalyEvent published + backend_health written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualIsolateResponse'
        '400':
          description: Missing backend_id or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Envelope publish or backend_health write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/lb/state:
    get:
      summary: Current LB adapter state
      description: |
        Returns the lb-sidecar's in-memory view of the upstream weight table
        and the set of currently-excluded backends (port 8087).
        Returns 503 when the run loop is not enabled or not yet ready.
      tags: [lb-sidecar]
      responses:
        '200':
          description: Current upstream weights and exclusions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LbState'
        '503':
          description: Run loop not enabled or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/lb/weights:
    post:
      summary: Override upstream weights
      description: |
        Operator-supplied weight override. Accepts a JSON object mapping
        backend_id (container_name:port) → integer weight. Rewrites the
        NGINX upstream block immediately. Excluded backends are not affected.
        Lives on the lb-sidecar service (port 8087).
      tags: [lb-sidecar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LbWeightOverride'
      responses:
        '200':
          description: Weights applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LbWeightOverrideResponse'
        '400':
          description: Empty body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Adapter write or nginx reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Run loop not enabled or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/lb/algorithm:
    post:
      summary: Switch NGINX upstream algorithm
      description: |
        Switch the NGINX upstream load-balancing algorithm. Resets every
        server weight to 1 (equal) before writing the new directive so the
        chosen algorithm operates without any prior RL-applied bias. The
        change takes effect on the next `nginx -s reload` triggered by
        the adapter (within the same call).
        Lives on the lb-sidecar service (port 8087).
      tags: [lb-sidecar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LbAlgorithmOverride'
      responses:
        '200':
          description: Algorithm switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LbAlgorithmOverrideResponse'
        '400':
          description: Unsupported algorithm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Adapter write or nginx reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Run loop not enabled or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/metrics:
    get:
      summary: Read recent metric rows
      tags: [telemetry]
      parameters:
        - in: query
          name: service
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, default: '5m' }
      responses:
        '200':
          description: Metric rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricRow'

  /api/v1/stats:
    get:
      summary: Telemetry service own-observability counters
      tags: [telemetry]
      responses:
        '200':
          description: Counters describing the telemetry ingest path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryStats'

components:
  schemas:
    HealthOk:
      type: object
      required: [status, service, redis, timescaledb]
      properties:
        status:      { type: string, enum: [ok] }
        service:     { type: string }
        redis:       { type: boolean }
        timescaledb: { type: boolean }
        policy_loaded:  { type: boolean }
        policy_version: { type: integer }
    HealthDegraded:
      type: object
      required: [status, service, redis, timescaledb, errors]
      properties:
        status:      { type: string, enum: [degraded] }
        service:     { type: string }
        redis:       { type: boolean }
        timescaledb: { type: boolean }
        errors:
          type: array
          items: { type: string }

    Policy:
      type: object
      description: |
        Canonical operating policy snapshot. Reflects services/policy-manager
        validation.py; the live validator is authoritative when the spec lags.
      required:
        - operating_mode
        - safe_mode
        - min_backends
        - max_backends
        - slo_p95_latency_ms
        - anomaly_latency_multiplier
        - per_instance_capacity_rps
        - autoscaler_cooldown_seconds
        - policy_version
      properties:
        operating_mode:
          type: string
          enum: [classical-only, hybrid, rl-only]
        safe_mode:                       { type: boolean }
        min_backends:                    { type: integer, minimum: 1 }
        max_backends:                    { type: integer, minimum: 1 }
        slo_p95_latency_ms:              { type: integer, minimum: 1 }
        anomaly_latency_multiplier:      { type: number, minimum: 0 }
        per_instance_capacity_rps:       { type: number, minimum: 0 }
        autoscaler_cooldown_seconds:     { type: number, minimum: 0 }
        policy_version:                  { type: integer, minimum: 0 }
        anomaly_response:
          type: string
          enum: [auto-isolate, advisory]
          default: auto-isolate
        anomaly_recovery_window_seconds: { type: integer, minimum: 1 }
        rl_exploration_rate:             { type: number, minimum: 0, maximum: 1 }
        rl_confidence_threshold:         { type: number, minimum: 0, maximum: 1 }

    PolicyPatch:
      type: object
      description: |
        Any subset of Policy fields. Missing fields keep their current value.
        `policy_version` is server-managed; clients should not send it.
      additionalProperties: true
      properties:
        operating_mode:
          type: string
          enum: [classical-only, hybrid, rl-only]
        safe_mode:                       { type: boolean }
        min_backends:                    { type: integer }
        max_backends:                    { type: integer }
        slo_p95_latency_ms:              { type: integer }
        anomaly_latency_multiplier:      { type: number }
        per_instance_capacity_rps:       { type: number }
        autoscaler_cooldown_seconds:     { type: number }
        anomaly_response:
          type: string
          enum: [auto-isolate, advisory]
        anomaly_recovery_window_seconds: { type: integer }
        rl_exploration_rate:             { type: number }
        rl_confidence_threshold:         { type: number }

    PolicyUpdateResponse:
      type: object
      required: [status, policy, changed_fields, policy_version]
      properties:
        status:
          type: string
          enum: [updated, no-op]
        policy:
          $ref: '#/components/schemas/Policy'
        changed_fields:
          type: array
          items: { type: string }
        policy_version:
          type: integer
        event_id:
          type: [string, "null"]
          description: |
            Envelope event_id published on smartload.policy. Null when the
            publish was skipped (best-effort path).

    PolicyAuditRow:
      type: object
      required: [time, policy_version, field, new_value, actor]
      properties:
        time:           { type: string, format: date-time }
        policy_version: { type: integer }
        field:          { type: string }
        old_value:
          description: Previous value (JSON-decoded). Null on first write of the field.
        new_value:
          description: New value (JSON-decoded).
        actor:
          type: string

    ScalingAuditRow:
      type: object
      required: [time, action, instance_count]
      properties:
        time:           { type: string, format: date-time }
        action:
          type: string
          enum: [scale_out, scale_in]
          description: Direction of the scaling action.
        instance_count:
          type: integer
          description: Resulting backend count after the action.
        reason:
          type: string
          nullable: true
          description: Human-readable justification (e.g. "forecast predicted 450 rps").

    ManualScaleRequest:
      type: object
      required: [target_count]
      properties:
        target_count:
          type: integer
          description: |
            Desired backend count after the action. Must be in
            `[policy.min_backends, policy.max_backends]`.
        actor:
          type: string
          description: |
            Logical actor name. Falls back to the `X-Actor` header, then
            to `"operator"`.
        reason:
          type: string
          description: |
            Free-text justification. Prefixed with `manual:<actor>:` in
            the audited row.

    ManualScaleResponse:
      type: object
      required: [status, action, target_count, previous_count, final_count, steps_actuated, steps_requested, reason, event_id]
      properties:
        status:
          type: string
          enum: [applied, noop]
        action:
          type: string
          enum: [scale_out, scale_in, noop]
        target_count:    { type: integer }
        previous_count:  { type: integer }
        final_count:     { type: integer }
        steps_actuated:  { type: integer }
        steps_requested: { type: integer }
        reason:          { type: string }
        event_id:        { type: string, format: uuid }

    ManualIsolateRequest:
      type: object
      required: [backend_id, status]
      properties:
        backend_id:
          type: string
          description: |
            Backend instance identifier — matches the value the engine
            would publish (e.g. `"backend_1"` or `"172.18.0.5:8080"`).
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        actor:  { type: string }
        reason: { type: string }

    ManualIsolateResponse:
      type: object
      required: [status, backend_id, anomaly_status, score, actor, reason, event_id]
      properties:
        status:         { type: string, enum: [applied] }
        backend_id:     { type: string }
        anomaly_status: { type: string, enum: [healthy, degraded, unhealthy] }
        score:          { type: number }
        actor:          { type: string }
        reason:         { type: string }
        event_id:       { type: string, format: uuid }

    MetricRow:
      type: object
      properties:
        time:        { type: string, format: date-time }
        service:     { type: string }
        instance:    { type: string }
        metric_name: { type: string }
        value:       { type: number }

    TelemetryStats:
      type: object
      required: [service, rows_written, batches_written, rows_dropped_db, rows_dropped_shape]
      properties:
        service:            { type: string }
        rows_written:       { type: integer }
        batches_written:    { type: integer }
        rows_dropped_db:    { type: integer }
        rows_dropped_shape: { type: integer }

    LbState:
      type: object
      required: [upstream_weights, excluded_backends]
      properties:
        upstream_weights:
          type: object
          additionalProperties:
            type: integer
          description: Map of backend_id (container:port) → NGINX weight (integer ≥ 1).
        excluded_backends:
          type: array
          items: { type: string }
          description: Backends currently serving no traffic (NGINX `down` directive).

    LbWeightOverride:
      type: object
      additionalProperties:
        type: integer
        minimum: 1
      description: Map of backend_id (container:port) → desired weight.
      example:
        "smartload-test-backend-1:8080": 90
        "smartload-test-backend-2:8080": 50

    LbWeightOverrideResponse:
      type: object
      required: [ok, applied_weights]
      properties:
        ok:              { type: boolean }
        applied_weights:
          type: object
          additionalProperties:
            type: integer

    LbAlgorithmOverride:
      type: object
      required: [algorithm]
      properties:
        algorithm:
          type: string
          enum: [round_robin, least_conn, random]
          description: |
            NGINX-native upstream algorithm. `round_robin` is the default
            and requires no directive. `least_conn` adds `least_conn;` to
            the upstream block (NGINX routes to the backend with the
            fewest active connections). `random` adds `random;` (uniform).
      example:
        algorithm: least_conn

    LbAlgorithmOverrideResponse:
      type: object
      required: [ok, algorithm]
      properties:
        ok:        { type: boolean }
        algorithm: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:   { type: string }
        field:
          type: [string, "null"]
          description: |
            Names the offending field when the server can pinpoint it
            (validation errors). Null otherwise.

